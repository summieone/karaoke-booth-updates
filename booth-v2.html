<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Booth v2</title>
<!--
  booth-v2.html — preview of the new Design-tool booth layout
  (Browse / Swipe / Radio tabs) wired to THIS server's real APIs:
    /api/songs            — song library from the songs folder
    /api/categories       — category list (matches admin)
    /api/artwork-index    — local artwork map from cache_album_art.py
    /api/artwork/<name>   — cached jpg
    /api/itunes-search    — server-proxied iTunes lookup (CORS-safe)
    /songs/<filename>     — streams the actual video/audio file
  The existing karaoke-booth.html is UNTOUCHED. Open this at:
    http://localhost:8080/booth-v2.html
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000;
    font-family: "Inter", -apple-system, system-ui, sans-serif; color: white;
    overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; }
  #kiosk { width: 1280px; height: 800px; transform-origin: center;
    box-shadow: 0 40px 120px rgba(0,0,0,0.9); border-radius: 18px;
    overflow: hidden; position: relative; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.85; } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  input { font-family: inherit; }
  /* Kiosk lockdown — kill the long-press callout / text selection. A
     press-and-hold otherwise pops the OS/browser context menu, which lets a
     customer exit fullscreen. Inputs keep normal selection so search works. */
  #kiosk, #kiosk * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #kiosk input, #kiosk textarea { -webkit-user-select: text; user-select: text; }
  .loading-overlay { position: absolute; inset: 0; background: #060309;
    display: flex; align-items: center; justify-content: center; z-index: 99;
    flex-direction: column; gap: 14px; color: #a1a1aa; font-size: 14px;
    letter-spacing: 3px; text-transform: uppercase; }
  .loading-overlay .bar { width: 160px; height: 4px; background: rgba(255,255,255,0.08);
    border-radius: 2px; overflow: hidden; position: relative; }
  .loading-overlay .bar::after { content: ''; position: absolute; inset: 0 60% 0 0;
    background: linear-gradient(90deg, #fbbf24, #f472b6);
    animation: load 1.2s infinite ease-in-out; border-radius: 2px; }
  @keyframes load { 0% { left: -40%; right: 100%; } 50% { left: 20%; right: 20%; } 100% { left: 100%; right: -40%; } }
  /* Build tag — plain HTML, outside React. Lets us confirm at a glance which
     build a booth is actually running (deploys were silently serving stale
     files). Dim + tiny + non-interactive; safe to leave in. */
  #buildtag { position: fixed; bottom: 3px; left: 5px; z-index: 99999;
    font: 10px/1 monospace; color: rgba(255,255,255,0.30);
    pointer-events: none; user-select: none; }
</style>
</head>
<body>
<div id="buildtag">build SEP15-A pywebview</div>
<script>
  /* Self-calibrating fullscreen: report THIS window's title-bar height to the
     positioner script via the window title, so it can shift the window up by
     exactly the right amount on any screen / display-scaling with no hardcoded
     value. (outerHeight-innerHeight) is the chrome height in CSS px; * DPR
     gives physical px. The launcher matches the window by the "Karaoke Booth v2"
     prefix, so appending this tag is safe. */
  (function () {
    var base = 'Karaoke Booth v2';
    function report() {
      try {
        var tb = window.outerHeight - window.innerHeight;
        if (tb < 0) tb = 0;
        document.title = base + ' ~TB=' + tb + ' DPR=' + window.devicePixelRatio + '~';
      } catch (e) {}
    }
    report();
    [400, 1000, 2000, 3500, 6000].forEach(function (ms) { setTimeout(report, ms); });
  })();
</script>
<div id="stage"><div id="kiosk"><div id="root">
  <div class="loading-overlay"><div>Loading library</div><div class="bar"></div></div>
</div></div></div>

<!-- Audio element lives outside the React tree (booth has speakers — no UI). -->
<audio id="bvAud" preload="auto" style="display:none"></audio>

<script src="/player.js"></script>
<!-- Vendored libraries (production builds) served from the booth's own disk —
     boot no longer depends on unpkg/internet. The three .min.js files live flat
     next to this HTML (auto-update manifest filenames must be plain, no dirs).
     If a booth has this HTML but not the files yet, the fallback below pulls
     the same versions from the CDN like the old builds did. -->
<script src="/react.production.min.js"></script>
<script src="/react-dom.production.min.js"></script>
<script src="/babel.min.js"></script>
<script>
  if (!window.React)    document.write('<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin><\/script>');
  if (!window.ReactDOM) document.write('<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin><\/script>');
  if (!window.Babel)    document.write('<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin><\/script>');
</script>

<script type="text/babel" data-presets="react">
// ============================================================
// FIT KIOSK TO VIEWPORT
// ============================================================
function fitKiosk() {
  const k = document.getElementById('kiosk');
  const sx = window.innerWidth / 1280;
  const sy = window.innerHeight / 800;
  // Fill the viewport — scale up past 1x if the window is bigger.
  // Uniform scaling keeps the 16:10 aspect ratio (one axis touches the edge).
  k.style.transform = 'scale(' + Math.min(sx, sy) + ')';
}
window.addEventListener('resize', fitKiosk);
setTimeout(fitKiosk, 30);

// ============================================================
// AUTO-UPDATE ON BOOT (opt-in per booth)
// When the Admin → Setup → Auto-update toggle is ON, the booth checks the
// manifest ~8s after boot (after first paint), applies any update and
// reloads itself. Meant for the guinea-pig booth (studio); other booths
// leave it OFF and staff press Check/Apply in Admin after staff-verify.
// ============================================================
(function migrateUpdateChannel() {
  // One-time migration out of the typed-URL era. A booth already pointed at
  // the staging manifest IS the studio, and must stay on that channel - if it
  // fell through to the default it would quietly move itself onto the booths'
  // channel the moment this build landed, and stop being the canary.
  try {
    if (localStorage.getItem('boothV2UpdateChannel')) return;
    if (/manifest-staging/i.test(localStorage.getItem('boothV2UpdateUrl') || '')) {
      localStorage.setItem('boothV2UpdateChannel', 'staging');
    }
  } catch (e) {}
})();

(function assertUpdateAddressOnBoot() {
  // Tell the server this booth's baked-in manifest address, every boot. It
  // costs one local request and means a booth can never be stranded by a
  // lost, mistyped or half-rolled-back address. The checking and installing
  // is driven from App (it needs to know whether anyone is singing).
  setTimeout(() => { updAssertUrl('current').catch(() => {}); }, 2000);
})();

// ============================================================
// ARTWORK CACHE — uses the server's smart multi-strategy lookup
// 1) _artworkIndex      → /api/artwork/<name>      (local disk, instant)
// 2) /api/streaming-art-bulk on boot                (warm hits in one request)
// 3) /api/streaming-art (server-side multi-strategy + disk cache)
// 4) gradient fallback
// ============================================================
const _artCache = {};       // key -> url | '' | null(pending)
const _artListeners = new Map();   // artKey -> Set<fn>: only tiles showing that song re-render
let _artworkIndex = {};
let _cacheReady = false;

// Per-key subscription. Previously this was a single global Set, so EVERY
// art fetch that resolved re-rendered EVERY mounted tile. With the boot-time
// pre-warm walking the whole library (hundreds of fetches), that caused the
// entire grid to flash continuously while browsing. Now a resolved key only
// wakes the tiles actually showing that song.
function onArtUpdate(key, fn) {
  if (!key) return () => {};
  let set = _artListeners.get(key);
  if (!set) { set = new Set(); _artListeners.set(key, set); }
  set.add(fn);
  return () => {
    const s = _artListeners.get(key);
    if (s) { s.delete(fn); if (!s.size) _artListeners.delete(key); }
  };
}
function _notifyArt(key) {
  const s = _artListeners.get(key);
  if (s) s.forEach(fn => fn());
}
// Use ytId (for streaming) or filename (for local), falling back to artist|title.
// IMPORTANT: this is also the cache key the server uses, so be consistent.
function artKey(song) {
  if (!song) return '';
  return song.ytId || song.filename || song.id || ((song.artist||'') + '|' + (song.title||'')).toLowerCase();
}

(function loadLocalArtCache() {
  try {
    const saved = localStorage.getItem('boothV2ArtCache');
    if (saved) {
      const raw = JSON.parse(saved);
      Object.keys(raw).forEach(k => { if (raw[k]) _artCache[k] = raw[k]; });
    }
  } catch(e) {}
})();

let _saveTimer = null;
function _persistArtCache() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      const hits = {};
      Object.keys(_artCache).forEach(k => { if (_artCache[k]) hits[k] = _artCache[k]; });
      localStorage.setItem('boothV2ArtCache', JSON.stringify(hits));
    } catch(e) {}
  }, 800);
}

const _pendingQueue = [];        // background pre-warm queue (FIFO)
const _priorityQueue = [];        // visible-now queue (jumps ahead of pre-warm)
let _activeFetches = 0;
const MAX_CONCURRENT = 4;

function _queueArtFetch(song, priority) {
  const k = artKey(song);
  if (!k) return;
  if (_artCache[k] !== undefined) return;
  _artCache[k] = null;

  // Local artwork file? Use it instantly.
  if (song.filename && _artworkIndex[song.filename]) {
    _artCache[k] = '/api/artwork/' + encodeURIComponent(_artworkIndex[song.filename]);
    _notifyArt(k);
    return;
  }
  // Priority requests (currently-visible art) jump to the front of the
  // line — otherwise the dial-spin user waits behind 500 background pre-warms.
  if (priority) _priorityQueue.push(song);
  else _pendingQueue.push(song);
  _drainQueue();
}

function _drainQueue() {
  while (_activeFetches < MAX_CONCURRENT && (_priorityQueue.length || _pendingQueue.length)) {
    // Priority queue drains first; background fills only when no priority work is queued.
    const song = _priorityQueue.length ? _priorityQueue.shift() : _pendingQueue.shift();
    _activeFetches++;
    const k = artKey(song);
    // Use the server's smart lookup — Deezer first, iTunes fallback, persistent
    // disk cache shared across all booths.
    const params = new URLSearchParams({
      ytId: k,
      title: song.title || '',
      artist: song.artist || '',
    });
    fetch('/api/streaming-art?' + params.toString())
      .then(r => r.json())
      .then(data => {
        // If both providers missed AND this is a streaming song, fall back to
        // the YouTube channel thumbnail rather than showing the gradient.
        const url = (data && data.url) ? data.url : (song.thumbnail || '');
        _artCache[k] = url;
        _persistArtCache();
        _notifyArt(k);
      })
      .catch(() => {
        // Network error: same fallback logic.
        _artCache[k] = song.thumbnail || '';
        _notifyArt(k);
      })
      .finally(() => { _activeFetches--; _drainQueue(); });
  }
}

function getArt(song) {
  if (!song) return null;
  const k = artKey(song);
  if (!k) return null;
  if (_artCache[k] !== undefined) return _artCache[k] || null;
  // Anything reaching here is being requested for display — give it priority
  // over the bulk pre-warm so the user doesn't wait behind hundreds of others.
  _queueArtFetch(song, true);
  // While we're waiting, show the YouTube thumbnail if we have one — beats
  // the gradient placeholder for the few seconds before the lookup returns.
  if (song.thumbnail) return song.thumbnail;
  return null;
}

function useArt(song) {
  const [, setTick] = React.useState(0);
  const k = artKey(song);
  // Subscribe only to THIS song's key, so a resolved fetch elsewhere in the
  // library doesn't re-render this tile (the cause of the browse flashing).
  React.useEffect(() => onArtUpdate(k, () => setTick(t => t + 1)), [k]);
  return getArt(song);
}

// ============================================================
// FALLBACK GRADIENT ART (seeded by title+artist)
// ============================================================
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function gradientFor(song, size = 120) {
  const h = hashStr((song.title || '') + (song.artist || ''));
  const hue1 = h % 360;
  const hue2 = (hue1 + 40 + (h % 80)) % 360;
  return {
    style: {
      width: '100%', height: '100%',
      background: `linear-gradient(135deg, oklch(0.55 0.18 ${hue1}) 0%, oklch(0.35 0.15 ${hue2}) 100%)`,
      display: 'flex', alignItems: 'flex-end', padding: 8,
      boxShadow: 'inset 0 0 30px rgba(0,0,0,0.25)',
      position: 'relative', overflow: 'hidden',
    },
    stripe: {
      position: 'absolute', inset: 0,
      background: `repeating-linear-gradient(45deg, transparent 0 ${Math.max(12, size/8)}px, rgba(255,255,255,0.04) ${Math.max(12,size/8)}px ${Math.max(14,size/8+2)}px)`,
    },
    initials: (song.artist || '?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()
  };
}

function RealArtTile({ song, size = 88, onClick, style = {}, showMeta = false }) {
  const art = useArt(song);
  const g = gradientFor(song, size);
  return (
    <div onClick={onClick} style={{
      width: size, height: size, flexShrink: 0,
      borderRadius: 8, position: 'relative', overflow: 'hidden',
      cursor: onClick ? 'pointer' : 'default',
      boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
      ...style,
    }}>
      {art ? (
        <img src={art} alt="" draggable="false" loading="lazy" style={{
          width: '100%', height: '100%', objectFit: 'cover',
          display: 'block', userSelect: 'none',
        }}/>
      ) : (
        <div style={g.style}>
          <div style={g.stripe}/>
          <div style={{ position: 'absolute', inset: 0, display: 'flex',
            alignItems: 'center', justifyContent: 'center',
            fontSize: size * 0.32, fontWeight: 900, color: 'rgba(255,255,255,0.5)',
            fontFamily: 'Georgia, serif' }}>{g.initials}</div>
        </div>
      )}
      {song.isYt && (
        <div title="Streaming" style={{
          position: 'absolute', top: 6, right: 6,
          fontSize: 12, color: 'white',
          width: 22, height: 22, borderRadius: '50%',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: 'rgba(6,182,212,0.85)',
          boxShadow: '0 2px 6px rgba(0,0,0,0.4)',
        }}>📡</div>
      )}
      {showMeta && (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0,
          padding: '16px 10px 8px',
          background: 'linear-gradient(to top, rgba(0,0,0,0.85), transparent)',
          color: 'white' }}>
          <div style={{ fontSize: 11, fontWeight: 800, lineHeight: 1.15,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{song.title}</div>
          <div style={{ fontSize: 9, opacity: 0.85,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{song.artist}</div>
        </div>
      )}
    </div>
  );
}

function RealNowPlayingArt({ song }) {
  const art = useArt(song);
  if (!song) {
    return <div style={{ width: '100%', height: '100%', background: '#0a0a0a',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: '#555', fontFamily: 'ui-monospace, monospace', fontSize: 12, letterSpacing: 2 }}>
      — NO SONG —
    </div>;
  }
  const g = gradientFor(song, 300);
  return (
    <div style={{ width: '100%', height: '100%', position: 'relative', overflow: 'hidden',
      borderRadius: 8, background: '#000' }}>
      {art ? (
        <>
          <img src={art} alt="" style={{ position: 'absolute', inset: 0,
            width: '100%', height: '100%', objectFit: 'cover',
            filter: 'blur(30px) brightness(0.7)', transform: 'scale(1.15)' }}/>
          <img src={art} alt="" style={{ position: 'relative', zIndex: 1,
            height: '100%', width: 'auto', margin: '0 auto', display: 'block' }}/>
        </>
      ) : (
        <div style={g.style}><div style={g.stripe}/></div>
      )}
      <div style={{ position: 'absolute', left: 14, right: 14, bottom: 10, zIndex: 2,
        color: 'white', textShadow: '0 2px 8px rgba(0,0,0,0.8)' }}>
        <div style={{ fontSize: 14, fontWeight: 800, lineHeight: 1.1 }}>{song.title}</div>
        <div style={{ fontSize: 11, opacity: 0.9 }}>{song.artist}</div>
      </div>
    </div>
  );
}

// ============================================================
// YOUTUBE PLAYLISTS — shares cache with the classic booth
// Classic booth writes: localStorage.karaokeYtPlaylistCache
//                       localStorage.karaokeYtPlaylistOverrides
//                       localStorage.karaokeYtApiKey
//                       localStorage.karaokeYtEnabled
// We read those so YT songs appear here without re-setup.
// ============================================================
function norm(s) { return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim(); }
function matchScore(catName, playlistName) {
  const cn = norm(catName), pn = norm(playlistName);
  if (cn === pn) return 100;
  if (cn.includes(pn) || pn.includes(cn)) return 80;
  const stop = new Set(['the','a','an','and','or','of','in','on','at','to','for','with','by','s']);
  const words = s => new Set(norm(s).split(' ').filter(w => w.length > 1 && !stop.has(w)));
  const cw = words(catName), pw = words(playlistName);
  if (!cw.size || !pw.size) return 0;
  let shared = 0;
  cw.forEach(w => { if (pw.has(w)) shared++; });
  pw.forEach(w => { if (cn.includes(w) && !cw.has(w)) shared += 0.5; });
  return (shared / Math.max(cw.size, pw.size)) * 70;
}

// Strip karaoke / official / channel artefacts from YT titles so the
// "Artist — Title" layout is closer to the local library.  Trimmed-down
// version of v1's parseStreamingTitle.
function parseStreamingTitle(raw, channel) {
  // Strip music symbols, Japanese brackets
  let s = (raw || '')
    .replace(/[♫♬♪🎵🎶]/g, '')
    .replace(/【[^】]*】/g, ' ');
  // Strip parenthesised junk that contains any karaoke marker keyword
  s = s.replace(/[\(\[][^\)\]]*?(karaoke|instrumental|backing|sing along|with lyrics?|lyric video|lyrics on screen|lyrics|on screen|official|hd|4k|video|version|cover|remix|live|acoustic|unplugged|minus one|multiplex|multi.?plex|stereo|mono|tribute|in the style of|made popular by|piano|guitar|playback|originally performed)[^\)\]]*[\)\]]?/gi, '');
  // Strip "in the style of <something>" / "made popular by <something>" suffixes
  s = s.replace(/\s*[-–—]\s*(in the style of|made popular by|originally performed by|popularized by|tribute to|cover of)\s+.*$/i, '');
  // Strip trailing dash-separated karaoke markers
  s = s.replace(/\s*[-–—]\s*(karaoke|instrumental|backing track|sing along|with lyrics|on screen|lyric video|video|cover|remix|live|acoustic|tribute)\b.*$/i, '');
  // Strip standalone karaoke keywords
  s = s.replace(/\b(karaoke|instrumental|with lyrics|lyric video|on screen|backing track|playback|tribute version|multiplex|multi.?plex)\b/gi, '');
  // Strip pipe-separated channel suffixes (e.g. "Madonna - Like a Prayer | Sing King")
  s = s.split('|')[0];
  // Cleanup whitespace and stray punctuation
  s = s.replace(/\s{2,}/g, ' ').trim();
  s = s.replace(/^[,\-–—.\s]+|[,\-–—.\s]+$/g, '').trim();

  let artist = '', title = s;
  // Try "Artist — Title" / "Artist - Title"
  const m = s.match(/^(.+?)\s*[-–—]\s*(.+)$/);
  if (m && m[1].length < 60) { artist = m[1].trim(); title = m[2].trim(); }
  if (!artist && channel) {
    artist = channel.replace(/\b(karaoke|official|channel|vocal.?star|ameritz|sing king|stingray|the karaoke channel|party tyme)\b/gi, '')
                    .replace(/\s{2,}/g, ' ').trim();
  }
  return { title, artist };
}

// Fetch all matched playlists' contents from YouTube Data API and write
// them to localStorage.karaokeYtPlaylistCache.  Replaces v1's fetcher so
// v2 doesn't need v1 to populate the cache.
async function fetchAllPlaylists(matchedByCat, apiKey, onProgress) {
  if (!apiKey) throw new Error('No YouTube API key — set one in Admin');
  const cache = (() => { try { return JSON.parse(localStorage.getItem('karaokeYtPlaylistCache') || '{}') || {}; } catch (e) { return {}; } })();
  const ids = Array.from(new Set(Object.values(matchedByCat).map(m => m.playlistId).filter(Boolean)));
  let totalItems = 0;
  for (let i = 0; i < ids.length; i++) {
    const pid = ids[i];
    if (onProgress) onProgress({ stage: 'fetching', i, total: ids.length, pid });
    const items = [];
    const seen = new Set();
    let pageToken = '';
    let pages = 0;
    while (pages < 4 && items.length < 200) {  // cap at 200 items / playlist
      const url = 'https://www.googleapis.com/youtube/v3/playlistItems'
        + '?part=snippet&maxResults=50&playlistId=' + encodeURIComponent(pid)
        + '&key=' + encodeURIComponent(apiKey)
        + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const r = await fetch(url);
      const data = await r.json();
      if (data.error) throw new Error(data.error.message || 'YT playlist error');
      (data.items || []).forEach(it => {
        const snip = it.snippet;
        if (!snip || !snip.resourceId || !snip.resourceId.videoId) return;
        const ytId = snip.resourceId.videoId;
        if (seen.has(ytId)) return;
        seen.add(ytId);
        const parsed = parseStreamingTitle(snip.title, snip.videoOwnerChannelTitle || snip.channelTitle);
        items.push({
          ytId, title: parsed.title || decodeHtml(snip.title),
          artist: parsed.artist || decodeHtml(snip.channelTitle || ''),
          thumbnail: (snip.thumbnails && (snip.thumbnails.medium || snip.thumbnails.default) || {}).url || '',
        });
      });
      pages++;
      if (!data.nextPageToken) break;
      pageToken = data.nextPageToken;
    }
    cache[pid] = { items, time: Date.now() };
    totalItems += items.length;
    localStorage.setItem('karaokeYtPlaylistCache', JSON.stringify(cache));
  }
  return { playlists: ids.length, songs: totalItems };
}

async function loadYtLibrary(categories) {
  // 1. Fetch playlist map from yt_playlists.txt
  let playlists = {};
  try {
    const r = await fetch('/api/yt-playlists');
    playlists = (await r.json()) || {};
  } catch(e) { return { matchedByCat: {}, itemsByCat: {}, rawPlaylists: {} }; }

  // 2. Match playlists → categories (same fuzzy matcher as classic booth)
  const matchedByCat = {};     // { categoryName: { playlistId, playlistName } }
  const unmatched = [];
  Object.keys(playlists).forEach(plName => {
    const pid = playlists[plName];
    let bestCat = null, bestScore = 30;
    categories.forEach(cat => {
      const s = matchScore(cat, plName);
      if (s > bestScore) { bestScore = s; bestCat = cat; }
    });
    if (bestCat && !matchedByCat[bestCat]) {
      matchedByCat[bestCat] = { playlistId: pid, playlistName: plName, score: bestScore };
    } else {
      unmatched.push({ playlistId: pid, playlistName: plName });
    }
  });

  // 3. Merge any admin-entered overrides (classic booth writes these)
  try {
    const overrides = JSON.parse(localStorage.getItem('karaokeYtPlaylistOverrides') || '{}');
    Object.keys(overrides).forEach(k => {
      if (overrides[k] && !matchedByCat[k]) matchedByCat[k] = { playlistId: overrides[k], playlistName: '(override)', score: 100 };
    });
  } catch(e) {}

  // 4. Read cached items from localStorage (classic booth populated this)
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem('karaokeYtPlaylistCache') || '{}') || {}; } catch(e) {}

  const itemsByCat = {};
  Object.keys(matchedByCat).forEach(cat => {
    const pid = matchedByCat[cat].playlistId;
    const entry = cache[pid];
    if (entry && entry.items && entry.items.length) {
      // Tag items so we know they're streaming
      itemsByCat[cat] = entry.items.map(it => ({
        id: 'yt:' + it.ytId,
        ytId: it.ytId,
        title: it.title,
        artist: it.artist,
        thumbnail: it.thumbnail,
        duration: '',
        categories: [cat],
        isYt: true,
      }));
    }
  });

  return { matchedByCat, itemsByCat, rawPlaylists: playlists, unmatched };
}

// Once-per-boot guard for the streaming auto-refresh in useLibrary below.
let _ytAutoRefreshStarted = false;

// ============================================================
// LIBRARY LOADER
// ============================================================
function useLibrary(reloadKey) {
  const [state, setState] = React.useState({
    songs: null, categories: null, yt: null, error: null,
  });
  React.useEffect(() => {
    const _libT0 = performance.now();
    // NOTE: /api/streaming-art-bulk is deliberately NOT awaited here. On booths
    // whose local art-img cache is cold/broken, that endpoint can spend tens of
    // seconds re-downloading images server-side — it used to sit in this
    // Promise.all and hold the whole UI on the loading screen (52s observed).
    // Boot now waits only on the three fast local reads; bulk art merges in
    // after first paint and tiles wake up via _notifyArt as it lands.
    Promise.all([
      fetch('/api/songs').then(r => r.json()),
      fetch('/api/categories').then(r => r.json()),
      fetch('/api/artwork-index').then(r => r.json()).catch(() => ({})),
    ]).then(async ([songs, cats, idx]) => {
      trackTiming('libLoad', performance.now() - _libT0);
      _artworkIndex = idx || {};
      const yt = await loadYtLibrary(cats || []);
      const ytAll = [];
      Object.values(yt.itemsByCat).forEach(arr => ytAll.push(...arr));
      setState({ songs: songs || [], categories: cats || [], yt: { ...yt, all: ytAll }, error: null });
      // AUTO-REFRESH THE STREAMING CACHE (JUL20-A). Until now the playlist
      // cache was written ONCE — when an admin hit Save/Refresh — and then
      // served forever, so songs added to the YouTube playlists after setup
      // day never reached the booth. Once per boot: if we have an API key
      // and matched playlists, and any playlist's cache entry is missing,
      // empty, or older than 24h, re-download in the background and hot-swap
      // the streaming library in place (no reload, queue untouched). On
      // failure (offline, quota) we keep serving the old cache and log why.
      if (!_ytAutoRefreshStarted && yt.matchedByCat && Object.keys(yt.matchedByCat).length) {
        const _arKey = localStorage.getItem('karaokeYtApiKey') || '';
        let _arCache = {};
        try { _arCache = JSON.parse(localStorage.getItem('karaokeYtPlaylistCache') || '{}') || {}; } catch (e) {}
        const _DAY = 24 * 60 * 60 * 1000;
        const _arStale = Object.values(yt.matchedByCat).some(m => {
          const entry = _arCache[m.playlistId];
          return !entry || !entry.items || !entry.items.length || (Date.now() - (entry.time || 0)) > _DAY;
        });
        if (_arKey && _arStale) {
          _ytAutoRefreshStarted = true;
          setTimeout(async () => {
            try {
              const res = await fetchAllPlaylists(yt.matchedByCat, _arKey, null);
              const yt2 = await loadYtLibrary(cats || []);
              const ytAll2 = [];
              Object.values(yt2.itemsByCat).forEach(arr => ytAll2.push(...arr));
              setState(s => ({ ...s, yt: { ...yt2, all: ytAll2 } }));
              ytAll2.forEach(it => _queueArtFetch(it));
              console.log('%c📡 Streaming auto-refresh: ' + res.playlists + ' playlists, ' + res.songs + ' songs cached', 'color:#fbbf24;font-weight:bold');
            } catch (err) {
              console.warn('📡 Streaming auto-refresh failed — keeping cached copy:', err.message || err);
            }
          }, 5000);   // after first paint — prefetch stays off the boot critical path
        }
      }
      // AFTER first paint: bulk-load every artwork URL the server has cached
      // (one request instead of 500 individual lookups), then pre-warm the
      // rest. Visible tiles that resolve before the bulk lands still fetch
      // individually via the priority queue, so nothing waits on this.
      fetch('/api/streaming-art-bulk').then(r => r.json()).catch(() => ({})).then(bulkArt => {
        if (bulkArt && typeof bulkArt === 'object') {
          let upgraded = 0;
          Object.keys(bulkArt).forEach(k => {
            const url = bulkArt[k];
            if (!url) return;
            const cur = _artCache[k];
            // Fill keys nothing else claimed (undefined = not even pending).
            if (cur === undefined) { _artCache[k] = url; _notifyArt(k); return; }
            // UPGRADE stale remote URLs. Booths that browsed under pre-JUL02
            // builds have Deezer/iTunes CDN URLs baked into localStorage from
            // when the server handed out remote links, and nothing else ever
            // refreshes an already-cached key — so without this the booth
            // keeps loading slow CDN images forever even though the server
            // now has the bytes on local disk. A local /api/art-img/ URL
            // always beats a cached remote (http…) one — and a cached miss
            // ('' = gradient tile), since the server clearly has the art.
            // Pending (null) keys are left alone: their in-flight lookup
            // resolves from the same server cache anyway.
            if (cur !== null && url !== cur && url.indexOf('/api/art-img/') === 0 && (!cur || /^https?:/i.test(cur))) {
              _artCache[k] = url; upgraded++; _notifyArt(k);
            }
          });
          if (upgraded) _persistArtCache();
        }
        _cacheReady = true;
        // Pre-warm artwork for every song, AFTER the bulk merge — otherwise the
        // pre-warm would mark keys pending and fire individual lookups for art
        // the bulk response already had. Server caches results permanently, so
        // this only runs slow on the first ever boot.
        setTimeout(() => {
          (songs || []).forEach(s => _queueArtFetch(s));
          // ...and every streaming (YouTube) song too. They go through the
          // same Deezer/iTunes lookup, falling back to YT thumbnail on miss.
          ytAll.forEach(s => _queueArtFetch(s));
        }, 200);
      });
    }).catch(err => {
      setState({ songs: [], categories: [], yt: { matchedByCat: {}, itemsByCat: {}, all: [] }, error: String(err) });
    });
  }, [reloadKey]);
  return state;
}

// ============================================================
// SESSION TIMER — shares localStorage keys with the classic booth
// so both booths reflect the same session state.
// ============================================================
function useSessionTimer() {
  const [, setTick] = React.useState(0);
  React.useEffect(() => {
    const i = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(i);
  }, []);

  const startRaw = localStorage.getItem('karaokeSessionStart');
  const minsRaw = localStorage.getItem('karaokeSessionMinutes');
  const start = startRaw ? Number(startRaw) : null;
  const mins = minsRaw ? Math.max(1, Number(minsRaw)) : 120;

  if (!start) {
    return { active: false, mins, start: null, remainingMs: mins * 60 * 1000, label: 'Not started' };
  }
  const elapsed = Date.now() - start;
  const remainingMs = Math.max(0, mins * 60 * 1000 - elapsed);
  const hrs = Math.floor(remainingMs / 3600000);
  const mm = Math.floor((remainingMs % 3600000) / 60000);
  const ss = Math.floor((remainingMs % 60000) / 1000);
  const label = `${hrs}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  return { active: true, mins, start, remainingMs, label };
}

function setSessionTimer({ start, mins }) {
  if (start === null) localStorage.removeItem('karaokeSessionStart');
  else if (start !== undefined) localStorage.setItem('karaokeSessionStart', String(start));
  if (mins !== undefined) localStorage.setItem('karaokeSessionMinutes', String(mins));
}

// ============================================================
// ANALYTICS (Feature 3) — lightweight, localStorage-backed usage log so
// staff can see "what to improve": most-played songs, searches that found
// nothing (songs to add), demand for not-in-library streaming tracks, and
// how much each mode (Browse/Swipe/Radio) actually gets used.
//
// Storage decision (see CHANGELOG): per-booth localStorage only — no server
// or hub file is editable from here. It's wipeable and not cross-booth, but
// keeps dated events so we can roll up by 7d / 30d / all-time. A compact
// summary also rides the existing heartbeat so a future hub can render it
// with no booth rework.
// ============================================================
const ANALYTICS_KEY = 'karaokeAnalyticsV1';

  const sinceDay = windowDays ? new Date(since).toISOString().slice(0, 10) : '';
  const inWin = r => r && r.ts >= since;
  const plays = (o.plays || []).filter(inWin);
  const adds = (o.adds || []).filter(inWin);

  const supers = (o.supers || []).filter(inWin);

// ── Performance tracking ─────────────────────────────────────────
// Records timings (ms) for the things customers feel as "slow": album-art

const PERF_CAP = 120;  // rolling samples kept per metric

  const arr = Array.isArray(p[metric]) ? p[metric] : [];
  arr.push(ms);
  if (arr.length > PERF_CAP) arr.splice(0, arr.length - PERF_CAP);
  p[metric] = arr; o.perf = p;
  // (b) per-DAY aggregate — shipped to the hub so it can build per-room speed
  // history. Aggregates (n/sum/slow/max) keep it tiny; no per-sample storage.
  const slowMs = PERF_SLOW[metric] || 0;
  const day = new Date().toISOString().slice(0, 10);
  const pd = (o.perfDays && typeof o.perfDays === 'object') ? o.perfDays : {};
  const dd = (pd[day] && typeof pd[day] === 'object') ? pd[day] : {};
  const mm = (dd[metric] && typeof dd[metric] === 'object') ? dd[metric] : { n: 0, sum: 0, slow: 0, max: 0 };
