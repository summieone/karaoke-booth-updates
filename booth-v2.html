  }
} catch (e) {}

// ============================================================
// APP
// ============================================================
const ACCENT = { browse: '#fbbf24', swipe: '#a855f7', radio: '#06b6d4' };

function App() {
  // libReload bump triggers a re-fetch of /api/songs + categories + YT cache.
  // Used after admin actions like "Refresh streaming playlists".
  const [libReload, setLibReload] = React.useState(0);
  const lib = useLibrary(libReload);
  function reloadLibrary() { setLibReload(x => x + 1); }
  const timer = useSessionTimer();
  // Session is "expired" once a started timer has counted down to 0. Mirrors
  // v1's state.sessionExpired and gates all add/play paths below so nothing
  // new can be cued or started after time is up. expiredRef lets the
  // stale-closure player effects (init auto-start, 'ended' advance) read the
  // current value without re-binding.
  const expired = timer.active && timer.remainingMs <= 0;
  const expiredRef = React.useRef(expired);
  const [tab, setTab] = React.useState('browse');
  // Analytics: bank how long each mode (tab) stayed on-screen. Refs keep this
  // off the 1s timer tick — the effect only fires on an actual tab change, at
  // which point we credit the elapsed time to the tab we're leaving.
  const tabStartRef = React.useRef(Date.now());
  const prevTabRef = React.useRef(tab);
  React.useEffect(() => {
    const now = Date.now();
    trackModeDwell(prevTabRef.current, now - tabStartRef.current);
    prevTabRef.current = tab;
    tabStartRef.current = now;
  }, [tab]);
  // Brief "time's up" notice shown when a customer taps add/play after expiry.
  const [lockToast, setLockToast] = React.useState(false);
  const lockToastTimerRef = React.useRef(null);
  function notifyExpired() {
    setLockToast(true);
    if (lockToastTimerRef.current) clearTimeout(lockToastTimerRef.current);
    lockToastTimerRef.current = setTimeout(() => setLockToast(false), 2800);
  }
  const [queue, setQueue] = React.useState([]);
  const [liked, setLiked] = React.useState([]);
  // Songs the user has already seen in Swipe — kept at App level so it
  // survives switching tabs (Browse → Swipe shouldn't show the same first
  // card every time).  Resets on page reload.
  const [seenIds, setSeenIds] = React.useState(() => new Set());
  function markSeen(id) {
    setSeenIds(prev => { const next = new Set(prev); next.add(id); return next; });
  }
  const [nowPlaying, setNowPlaying] = React.useState(null);
  const [paused, setPaused] = React.useState(false);
  const [flash, setFlash] = React.useState(null);
  const [addedToast, setAddedToast] = React.useState(null);  // { song, position } | null
  const [adminOpen, setAdminOpen] = React.useState(false);

  // ── Software update scheduler ─────────────────────────────────────
  // Look for a new build in the background and, on a booth set to install
  // automatically, put it on while the room is empty. Never mid-song:
  // applying rewrites booth-v2.html underneath us and reloads the page.
  // No useSoftwareUpdate() here on purpose: App does not render any of this,
  // and subscribing it would re-render the whole tree (grid included) on every
  // update event for nothing. The card subscribes; App only drives.
  const updBusyRef = React.useRef({ busy: true, lastTouch: Date.now() });
  updBusyRef.current.busy = !!(nowPlaying || queue.length || timer.active || adminOpen);
  React.useEffect(() => {
    const touch = () => { updBusyRef.current.lastTouch = Date.now(); };
    window.addEventListener('pointerdown', touch, true);
    window.addEventListener('keydown', touch, true);
    let t = null, stopped = false;
    async function loop() {
      if (stopped) return;
      const r = await updCheck();
      let next = r.lastError ? UPDATE_RETRY_MS : UPDATE_CHECK_MS;
      if (r.available && updAuto() && updHeld().indexOf(r.available) === -1) {
        const b = updBusyRef.current;
        const idleFor = Date.now() - b.lastTouch;
        if (b.busy) {
          _updSet({ waitingBecause: 'the booth is in use' });
        } else if (idleFor < UPDATE_IDLE_MS) {
          _updSet({ waitingBecause: 'someone was using the booth a moment ago' });
          next = Math.min(next, UPDATE_IDLE_MS - idleFor + 5000);
        } else {
          _updSet({ waitingBecause: null });
          if (await updInstall()) return;      // reloads the page
        }
      } else {
        _updSet({ waitingBecause: null });
      }
      t = setTimeout(loop, next);
    }
    t = setTimeout(loop, 60000);   // let the library finish loading first
    return () => {
      stopped = true;
      clearTimeout(t);
      window.removeEventListener('pointerdown', touch, true);
      window.removeEventListener('keydown', touch, true);
    };
  }, []);

  // Visible diagnostics so we can spot wiring issues without DevTools.
  // Shown in the top bar.  status: 'init' | 'ready' | 'no-elements' | 'no-player-js'
  const [debugStatus, setDebugStatus] = React.useState('init');
  const [debugMsg, setDebugMsg] = React.useState('');

  // Multiplex (vocals on/off) state — surfaced into the QueueRail so the
  // host can toggle the demo vocal track on multiplex karaoke files.
  const [hasMultiplex, setHasMultiplex] = React.useState(false);
  const [vocalsOn, setVocalsOn] = React.useState(false);

  // Volume (0-100, %).  Persisted in localStorage so it survives reloads.
  const [volume, setVolume] = React.useState(
    () => parseInt(localStorage.getItem('karaokeVolume') || '85', 10)
  );
  React.useEffect(() => {
    if (playerRef.current) playerRef.current.setVolume(volume / 100);
    localStorage.setItem('karaokeVolume', String(volume));
  }, [volume]);

  // (Pitch / key-change UI intentionally not surfaced in v2 — the player.js
  // engine still supports it for classic via setPitch(), but v2's UX
  // doesn't need a key control.)

  // CDG / audio-only visibility — same localStorage key as classic, so
  // toggling here also affects the classic booth on next reload.
  const [showCdg, setShowCdg] = React.useState(
    () => localStorage.getItem('karaokeShowCdg') !== 'false'
  );
  function toggleShowCdg() {
    const next = !showCdg;
    setShowCdg(next);
    localStorage.setItem('karaokeShowCdg', String(next));
  }

  // ── Welcome screen state — when admin sends to welcome, an overlay
  // shows the singer's name and a "tap to start" button.  Once tapped,
  // the session timer begins and the welcome state clears.
  const [welcomeShown, setWelcomeShown] = React.useState(
    () => localStorage.getItem('karaokeWelcomeShown') === 'true'
  );
  const [singerName, setSingerName] = React.useState(
    () => localStorage.getItem('karaokeSingerName') || ''
  );
  // UI language — shares localStorage.karaokeLang with v1 so a customer's
  // pick carries across both booths. Flows down via LangCtx so the chrome
  // (tabs, queue rail) re-renders when it changes.
  const [language, setLanguage] = React.useState(
    () => localStorage.getItem('karaokeLang') || 'English'
  );
  function setLanguageSaved(l) {
    if (!UI_TRANSLATIONS[l]) l = 'English';
    setLanguage(l);
    localStorage.setItem('karaokeLang', l);
  }
  // ── Streaming-search grant. searchBump just forces a re-render so the
  // "{N} left" pill reflects a new limit immediately (it reads localStorage,
  // not state). grantSearches(n) adds a one-off bonus to the CURRENT session
  // only — it does NOT change the per-session limit for everyone, and never
  // touches the daily API quota. The bonus resets when a new session starts
  // (same reset gate as the "used" counter in sessionSearchInfo). Shared by the
  // Admin "+5 searches" button and the Bar Hub 'addSearches' command.
  const [searchBump, setSearchBump] = React.useState(0);
  function grantSearches(n) {
    const amt = Number(n) > 0 ? Number(n) : 5;
    sessionSearchInfo();  // run the per-session reset gate first (sync bonus to this session)
    const cur = parseInt(localStorage.getItem('karaokeYtSessionBonus') || '0', 10) || 0;
    localStorage.setItem('karaokeYtSessionBonus', String(cur + amt));
    setSearchBump(x => x + 1);
    return sessionSearchInfo().remaining;
  }
  function showWelcome(name, mins) {
    if (name) localStorage.setItem('karaokeSingerName', name);
    setSingerName(name || '');
    if (mins) localStorage.setItem('karaokeSessionMinutes', String(mins));
    localStorage.setItem('karaokeWelcomeShown', 'true');
    localStorage.removeItem('karaokeSessionStart');  // ensure we're "waiting"
    setWelcomeShown(true);
    // Stop any music left over from the previous session and clear the
    // queue — otherwise background playback bleeds into the welcome screen.
    try { if (playerRef.current) playerRef.current.stop(); } catch (e) {}
    setNowPlaying(null);
    setQueue([]);
  }
  function startFromWelcome() {
    setSessionTimer({ start: Date.now() });
    localStorage.removeItem('karaokeWelcomeShown');
    setWelcomeShown(false);
    // NOTE: the audience (TV) window is opened by the launcher (.bat), not from
    // here — opening it again would create a duplicate. Sync still flows to it
    // over BroadcastChannel.
  }
  function cancelWelcome() {
    localStorage.removeItem('karaokeWelcomeShown');
    localStorage.removeItem('karaokeSingerName');
    setWelcomeShown(false);
    setSingerName('');
  }

  // ── Venue branding (lifted to App so the top bar can render the
  // current name + logo without prop-drilling through every mode).
  const [venueName, setVenueName] = React.useState(
    () => localStorage.getItem('karaokeVenueName') || 'The Old School Yard'
  );
  const [venueTagline, setVenueTagline] = React.useState(
    () => localStorage.getItem('karaokeTagline') || 'Self-Service Karaoke'
  );
  const [logoUrl, setLogoUrl] = React.useState(
    () => localStorage.getItem('karaokeLogo') || ''
  );
  // Venue logo shown top-left: an admin upload wins, otherwise fall back to
  // the logo file sitting next to the booth (the server serves the booth
  // folder as static files).  A venue with neither gets onError → name only.
  const logoSrc = logoUrl || '/venue-logo.webp';
  const [logoBroken, setLogoBroken] = React.useState(false);
  React.useEffect(() => { setLogoBroken(false); }, [logoUrl]);
  // That logo doubles as a Home button: it jumps to Browse and bumps this
  // counter, which BrowseMode watches to drop back to the category page.
  // A counter rather than a boolean so a repeat press still fires when
  // Browse is already the active tab.
  const [browseHomeSignal, setBrowseHomeSignal] = React.useState(0);
  function goBrowseHome() {
    setTab('browse');
    setBrowseHomeSignal(n => n + 1);
  }

  // ── Admin PIN gate ─ matches v1: default PIN is "2010", required to
  // open admin or perform any privileged action.  PIN can be customised
  // via localStorage.karaokeAdminPin (admin can set it once unlocked).
  const [pinPrompt, setPinPrompt] = React.useState(null);   // { onOk } when shown

  // Screen mode — 'dual' means a second-screen TV/monitor is connected and
  // the booth becomes a control surface (album art instead of video).
  // 'single' means everything plays on the booth itself.
  // Stored in localStorage so it survives reloads and stays in sync with
  // the classic v1 booth which uses the same key.
  const [screenMode, setScreenMode] = React.useState(
    () => localStorage.getItem('karaokeScreenMode') || 'single'
  );
  function setScreenModeSaved(m) {
    setScreenMode(m);
    localStorage.setItem('karaokeScreenMode', m);
  }
  function requirePin(onOk) {
    setPinPrompt({ onOk });
  }
  function openAdminGated() {
    requirePin(() => setAdminOpen(true));
  }
  // Filtered view of the library — Browse/Swipe/Radio see only the
  // tracks the user wants to see.  YT items are always shown (no audio
  // type ambiguity for streaming).
  const filteredLib = React.useMemo(() => {
    if (showCdg) return lib;
    return Object.assign({}, lib, {
      songs: (lib.songs || []).filter(s => s.type !== 'cdg' && s.type !== 'audio'),
    });
  }, [lib, showCdg]);

  // Refs needed because React effects can read stale closures.
  const queueRef = React.useRef(queue);
  React.useEffect(() => { queueRef.current = queue; }, [queue]);
  const nowPlayingRef = React.useRef(nowPlaying);
  React.useEffect(() => { nowPlayingRef.current = nowPlaying; }, [nowPlaying]);
  const playerRef = React.useRef(null);
  // Stamp when a song is asked to start, so the player's 'play' event can
  // record how long it took to actually begin (perf tracking).
  const playStartRef = React.useRef(0);
  // Keep the expiry ref in step so the player's stale-closure handlers can
  // gate on it.
  React.useEffect(() => { expiredRef.current = expired; }, [expired]);

  // When the session expires, mirror v1's checkSession lockout: drop anything
  // still queued so nothing new plays, and if nothing is currently playing,
  // make sure the player is stopped/silent. A song already playing is left to
  // finish — the 'ended' handler checks expiredRef and won't advance.
  React.useEffect(() => {
    if (!expired) return;
    setQueue(q => (q.length ? [] : q));
    if (!nowPlayingRef.current && playerRef.current) {
      try { playerRef.current.stop(); } catch (e) {}
    }
  }, [expired]);

  // Kiosk lockdown — a press-and-hold on a touchscreen fires a 'contextmenu'
  // (right-click) event, and the resulting menu lets customers exit
  // fullscreen / leave the booth.  Swallow it everywhere so the booth stays
  // locked to the app.  Inputs still work normally (this only kills the menu).
  React.useEffect(() => {
    const blockMenu = e => { e.preventDefault(); return false; };
    document.addEventListener('contextmenu', blockMenu);
    return () => document.removeEventListener('contextmenu', blockMenu);
  }, []);

  // Initialise the shared KaraokePlayer once the QueueRail is mounted —
  // bvVid and bvCdg live inside it, so they don't exist on the first render
  // when the library is still loading.  Re-runs as deps settle; guarded
  // against double-init by playerRef.
  React.useEffect(() => {
    if (playerRef.current) return;
    if (!window.KaraokePlayer) {
      console.error('[booth-v2] player.js failed to load');
      setDebugStatus('no-player-js');
      setDebugMsg('player.js did not load — refresh the page');
      return;
    }
    const vid = document.getElementById('bvVid');
    const cdg = document.getElementById('bvCdg');
    const aud = document.getElementById('bvAud');
    const yt  = document.getElementById('bvYt');
    if (!vid || !cdg || !aud) {
      // QueueRail hasn't mounted yet — wait for next render.
      setDebugStatus('no-elements');
      setDebugMsg('vid=' + !!vid + ' cdg=' + !!cdg + ' aud=' + !!aud);
      return;
    }
    const p = new window.KaraokePlayer({
      videoEl: vid, audioEl: aud, cdgCanvas: cdg, ytIframe: yt,
    });
    p.on('play',  () => setPaused(false));
    p.on('pause', () => setPaused(true));
    p.on('ended', () => {
      // Session expired: let the song that was playing finish, but never
      // advance to a new one (mirrors v1's playNext expiry guard).
      if (expiredRef.current) {
        console.log('[booth-v2] song ended after expiry; not advancing');
        setNowPlaying(null);
        setHasMultiplex(false);
        try { p.stop(); } catch (e) {}
        return;
      }
      console.log('[booth-v2] song ended; advancing queue');
      const q = queueRef.current;
      if (q.length) {
        const next = q[0];
        setQueue(rest => rest.slice(1));
        trackPlay(next);
        setNowPlaying(next);
        // Re-detect multiplex for the new song (same as startSong does)
        setHasMultiplex(/multiplex/i.test(next.filename || ''));
        setVocalsOn(false);
        p.play(next).catch(e => console.warn('[booth-v2] play failed', e));
      } else {
        setNowPlaying(null);
        setHasMultiplex(false);
      }
    });
    p.on('error', e => {
      console.warn('[booth-v2] player error', e);
      setDebugMsg('error: ' + (e && (e.message || e.name) || 'unknown'));
    });
    p.on('play',  s => {
      setDebugMsg('playing: ' + (s && s.title || '?'));
      // perf: record how long from "start this song" to actual playback.
      // Only when we stamped a start (manual play) — skip resume (ref is 0).
      if (playStartRef.current) {
        trackTiming('playStart', performance.now() - playStartRef.current);
        playStartRef.current = 0;
      }
    });
    p.on('ended', s => setDebugMsg('ended: ' + (s && s.title || '?')));
    p.on('multiplexchange', has => {
      setHasMultiplex(has);
      setVocalsOn(false);  // vocals reset on every song
    });
    // Apply initial volume now that the player exists.
    p.setVolume(volume / 100);
    playerRef.current = p;
    window.player = p;  // for console debugging
    setDebugStatus('ready');
    setDebugMsg('player ready');
    console.log('[booth-v2] KaraokePlayer ready');

    // If the user queued songs before the player was ready, kick the queue —
    // unless the session has already expired, in which case stay silent.
    const waiting = queueRef.current;
    if (waiting.length && !expiredRef.current) {
      const next = waiting[0];
      setQueue(rest => rest.slice(1));
      trackPlay(next);
      setNowPlaying(next);
      p.play(next).catch(e => {
        console.warn('[booth-v2] auto-start failed', e);
        setDebugMsg('auto-start blocked — press ▶ Play queue');
      });
    }
  }, [lib.songs]);

  // ── Bar Hub heartbeat ────────────────────────────────────────────
  // Port of v1's _sendHeartbeat / _pollBarCommands. Hub IP is set in admin
  // (localStorage.karaokeHubIp). When set, heartbeat goes every 8s with the
  // current room/song/timer state, and we poll for commands every 4s
  // (addTime, setTime, startSession, stopSession, startTimer).
  React.useEffect(() => {
    function hubUrl() {
      const ip = localStorage.getItem('karaokeHubIp') || '';
      if (!ip) return null;
      const port = localStorage.getItem('karaokeHubPort') || '8888';
      return 'http://' + ip + ':' + port;
    }
    function roomId() {
      return localStorage.getItem('karaokeRoomId')
          || ((localStorage.getItem('karaokeVenueName') || 'Karaoke') + ' Room');
    }
    function sendHeartbeat() {
      const hub = hubUrl();
      if (!hub) return;
      const startRaw = localStorage.getItem('karaokeSessionStart');
      const minsRaw  = localStorage.getItem('karaokeSessionMinutes');
      const welcomeShown = localStorage.getItem('karaokeWelcomeShown') === 'true';
      const start = startRaw ? Number(startRaw) : null;
      const mins  = minsRaw  ? Math.max(1, Number(minsRaw)) : 120;
      // sessionActive in v1 means: admin has set up a session.
      // In v2 that's "welcomeShown OR start is set" — either we're showing
      // welcome OR the customer has tapped through and the timer is running.
      const sessionActive = welcomeShown || start !== null;
      const waitingForCustomer = welcomeShown && start === null;
      const elapsed = start ? (Date.now() - start) : 0;
      const limit = mins * 60 * 1000;
      const remainingMs = Math.max(0, limit - elapsed);
      const sessionExpired = !!start && elapsed > limit;
      const np = nowPlayingRef.current;
      // Per-day analytics buckets for the hub — throttled to ~30s (the hub
      // upserts idempotently, so it doesn't need them every 8s). Omitted on
      // off-beats to keep heartbeats small; the hub keeps the last set it saw.
      let hbAnalytics = null;
      if (Date.now() - _analyticsHbAt > 30000) {
        hbAnalytics = { v: 1, days: analyticsDailyBuckets(14) };
        _analyticsHbAt = Date.now();
      }
      const payload = {
        roomId:        roomId(),
        roomName:      localStorage.getItem('karaokeRoomName') || roomId(),
        venueName:     localStorage.getItem('karaokeVenueName') || '',
        sessionActive: sessionActive,
        sessionExpired: sessionExpired,
        waitingForCustomer: waitingForCustomer,
        remainingMs:   start ? remainingMs : null,
        sessionMinutes: mins,
        currentSong:   np ? ((np.artist || '') + ' — ' + (np.title || '')) : null,
        queueLength:   (queueRef.current || []).length,
        customerName:  localStorage.getItem('karaokeSingerName') || '',
        searchesRemaining: sessionSearchInfo().remaining,
        searchesLimit:     sessionSearchInfo().limit,   // base + any staff "+5" bonus, for "N of M left"
        // Per-day usage buckets (throttled — null on off-beats, which the hub
        // ignores). The hub upserts these by booth+day to build durable history.
        analytics:     hbAnalytics,
        // Compact performance summary (sent every beat, small) — the hub turns
        // this into a 🟢/🟠/🔴 speed pill so staff can spot a slow booth.
        perf:          analyticsPerfSummary(),
        ts:            Date.now(),
        boothVersion:  'v2',
      };
      fetch(hub + '/api/heartbeat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      }).catch(() => {});
    }
    function pollCommands() {
      const hub = hubUrl();
      if (!hub) return;
      fetch(hub + '/api/pending-commands?room=' + encodeURIComponent(roomId()))
        .then(r => r.json())
        .then(data => {
          if (!data.commands || data.commands.length === 0) return;
          data.commands.forEach(cmd => {
            if (cmd.type === 'addTime') {
              const cur = Number(localStorage.getItem('karaokeSessionMinutes') || 120);
              localStorage.setItem('karaokeSessionMinutes', String(cur + cmd.minutes));
              showBarToast('+' + cmd.minutes + ' min added by bar staff');
            } else if (cmd.type === 'setTime') {
              localStorage.setItem('karaokeSessionMinutes', String(cmd.minutes));
              if (localStorage.getItem('karaokeSessionStart')) {
                localStorage.setItem('karaokeSessionStart', String(Date.now()));
              }
              showBarToast('Time set to ' + cmd.minutes + ' min by bar staff');
            } else if (cmd.type === 'startSession') {
              if (cmd.minutes) localStorage.setItem('karaokeSessionMinutes', String(cmd.minutes));
              if (cmd.customerName) localStorage.setItem('karaokeSingerName', cmd.customerName);
              // Mark "welcome shown, waiting for customer"
              localStorage.setItem('karaokeWelcomeShown', 'true');
              localStorage.removeItem('karaokeSessionStart');
              setSingerName(cmd.customerName || '');
              setWelcomeShown(true);
              showBarToast('Session prepared by bar staff');
            } else if (cmd.type === 'stopSession') {
              localStorage.removeItem('karaokeSessionStart');
              localStorage.removeItem('karaokeWelcomeShown');
              localStorage.removeItem('karaokeSingerName');
              setWelcomeShown(false);
              setSingerName('');
              try { if (playerRef.current) playerRef.current.stop(); } catch (e) {}
              setNowPlaying(null);
              setQueue([]);
              showBarToast('Session stopped by bar staff');
            } else if (cmd.type === 'startTimer') {
              if (!localStorage.getItem('karaokeSessionStart')) {
                if (cmd.customerName) {
                  localStorage.setItem('karaokeSingerName', cmd.customerName);
                  setSingerName(cmd.customerName);
                }
                localStorage.setItem('karaokeSessionStart', String(Date.now()));
                localStorage.removeItem('karaokeWelcomeShown');
                setWelcomeShown(false);
                showBarToast('Timer started by bar staff');
              }
            } else if (cmd.type === 'addSearches') {
              // Grant a one-off bonus of streaming searches to THIS session only
              // (not the global limit, not the daily API quota) — mirrors the
              // Admin "+5 searches" button.
              const amt = Number(cmd.amount) > 0 ? Number(cmd.amount) : 5;
              grantSearches(amt);
              showBarToast('+' + amt + ' searches added by bar staff');
            }
          });
        })
        .catch(() => {});
    }
    function showBarToast(msg) {
      const el = document.createElement('div');
      el.textContent = '🍺 ' + msg;
      el.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;' +
        'background:rgba(16,185,129,0.95);color:white;font-size:14px;font-weight:700;' +
        'padding:12px 18px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.4);' +
        'pointer-events:none;';
      document.body.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.5s';
        setTimeout(() => el.remove(), 500);
      }, 4000);
    }
    sendHeartbeat();  // first one on boot
    const hbTimer = setInterval(sendHeartbeat, 8000);
    const pcTimer = setInterval(pollCommands, 4000);
    return () => { clearInterval(hbTimer); clearInterval(pcTimer); };
  }, []);  // start once; reads from localStorage + refs so it always sees the latest values

  // ── Second-screen lifecycle + sync ────────────────────────────────
  // In dual mode the booth becomes a control surface: a separate window
  // (typically displayed on a TV connected to this PC) plays the real
  // video & lyrics in sync with the booth's audio.  We open it on demand,
  // post sync messages to it, and close it when reverting to single mode.
  // This block is placed AFTER all state declarations so its effects'
  // dependency arrays don't read uninitialised consts (TDZ).
  const secondWinRef = React.useRef(null);
  const screenChannelRef = React.useRef(null);
  // True once an audience screen has announced itself on the channel -- whether
  // WE opened it (window.open) OR the launcher (launch.pyw / pywebview) did.
  // Lets dual-mode sync flow to a launcher-created TV and stops us opening a
  // duplicate. Mirrors v1's secondScreenViaBroadcast.
  const secondScreenSeenRef = React.useRef(false);
  const lastSyncSentRef = React.useRef(0);
  React.useEffect(() => {
    try {
      const ch = new BroadcastChannel('karaoke-screen-sync');
      screenChannelRef.current = ch;
      ch.onmessage = (e) => {
        const d = e && e.data;
        if (d && d.type === 'secondScreenReady') secondScreenSeenRef.current = true;
      };
    } catch (e) {}
    return () => { try { screenChannelRef.current && screenChannelRef.current.close(); } catch (e) {} };
  }, []);
  function sendToSecondScreen(msg) {
    const ch = screenChannelRef.current;
    if (ch) try { ch.postMessage(msg); } catch (e) {}
    const w = secondWinRef.current;
    if (w && !w.closed) try { w.postMessage(msg, '*'); } catch (e) {}
  }
  function hasSecondScreen() {
    const w = secondWinRef.current;
    return secondScreenSeenRef.current || !!(w && !w.closed);
  }
  function closeSecondScreen() {
    try {
      const ch = screenChannelRef.current;
      if (ch) ch.postMessage({ type: 'closeSelf' });
    } catch (e) {}
    sendToSecondScreen({ type: 'stop' });
    if (secondWinRef.current && !secondWinRef.current.closed) {
      try { secondWinRef.current.close(); } catch (e) {}
    }
    secondWinRef.current = null;
  }
  function openSecondScreenV2() {
    // IMPORTANT: this must run synchronously inside a user gesture (a click),
    // otherwise the browser blocks the popup and/or refuses fullscreen.
    // So no setTimeout / promise wrapping around the actual window.open.
    // Tell any existing second screen (incl. one v1 opened) to close itself.
    try {
      const ch = screenChannelRef.current;
      if (ch) ch.postMessage({ type: 'closeSelf' });
    } catch (e) {}
    if (secondWinRef.current && !secondWinRef.current.closed) {
      try { secondWinRef.current.close(); } catch (e) {}
    }
    secondWinRef.current = null;

    // Work out where to put it.  We read screen geometry synchronously from
    // window.screen (available without a promise).  The richer Window
    // Management API needs a promise which would break the gesture, so we
    // only use it to *move* the window afterwards, not to open it.
    const sw = window.screen.width || 1920;
    const sh = window.screen.height || 1080;
    // Default: assume the audience screen is to the right of the primary.
    let left = sw, top = 0, width = sw, height = sh;

    const w = window.open('/second-screen.html', 'KaraokeScreen',
      'popup=yes,width=' + width + ',height=' + height +
      ',left=' + left + ',top=' + top +
      ',toolbar=no,location=no,menubar=no,status=no,scrollbars=no');
    if (!w) {
      alert('The audience screen popup was blocked.\n\nClick the popup icon in the browser address bar, choose "Always allow", then press "Re-open audience screen" in admin.');
      return;
    }
    secondWinRef.current = w;
    try { w.focus(); } catch (e) {}

    // Now that it's open (gesture satisfied), use the Window Management API
    // if available to nudge it onto the actual second display.
    if (window.getScreenDetails) {
      window.getScreenDetails().then(details => {
        const primary = details.currentScreen;
        const second = details.screens.find(s => s !== primary) || primary;
        try {
          w.moveTo(second.availLeft, second.availTop);
          w.resizeTo(second.availWidth, second.availHeight);
        } catch (e) {}
      }).catch(() => {});
    }

    // NOTE: we deliberately do NOT keep re-nudging the window to a guessed
    // position. That fought the operator while they dragged the lyrics window
    // onto the TV (and guessed "TV on the right", wrong for a left-TV booth).
    // The one-shot getScreenDetails move above is best-effort; after that the
    // window stays exactly where you put it. Arrange it on the TV + fullscreen
    // once and it stays (same as v1).

    // Handshake — venue branding + wake (which also asks it to fullscreen).
    let attempts = 0;
    const handshake = setInterval(() => {
      attempts++;
      if (attempts > 60 || !hasSecondScreen()) { clearInterval(handshake); return; }
      sendToSecondScreen({ type: 'wake' });
      sendToSecondScreen({ type: 'venue', name: venueName, tagline: venueTagline });
      if (logoUrl) sendToSecondScreen({ type: 'logo', url: logoUrl });
    }, 200);
  }
  // We deliberately do NOT auto-open the second screen from this effect.
  // window.open() outside a user gesture is blocked by the browser (which is
  // exactly what happened in the studio — the old window closed but no new
  // one opened).  Opening now happens from the admin buttons, which ARE
  // gestures.  Here we only handle the auto-CLOSE when switching to single.
  React.useEffect(() => {
    if (screenMode === 'single' && hasSecondScreen()) {
      sendToSecondScreen({ type: 'stop' });
      try { secondWinRef.current.close(); } catch (e) {}
      secondWinRef.current = null;
    }
  }, [screenMode]);
  function _buildSyncMsg() {
    const p = playerRef.current;
    const s = nowPlaying;
    if (!s) return { type: 'stop', venueName };
    const isYt = !!s.ytId;
    const isCdg = s.type === 'cdg';
    const isAudio = s.type === 'audio';
    return {
      type: 'sync',
      isYouTube: isYt,
      ytId: s.ytId || null,
      songType: isCdg ? 'cdg' : (isAudio ? 'audio' : 'video'),
      cdgFile: s.cdgFile || null,
      src: isYt ? null : ('/songs/' + encodeURIComponent(s.filename || '')),
      title: s.title || '',
      artist: s.artist || '',
      time: p && p.getCurrentTime ? p.getCurrentTime() : 0,
      paused: paused,
      rate: 1,
    };
  }
  React.useEffect(() => {
    if (screenMode !== 'dual') return;
    if (!nowPlaying) {
      sendToSecondScreen({ type: 'stop', venueName });
      return;
    }
    sendToSecondScreen(_buildSyncMsg());
  }, [screenMode, nowPlaying, paused]);
  // NOTE — no continuous 10Hz sync loop.  Originally we mirrored v1's
  // approach of sending a sync message every 100ms so the second screen
  // could correct drift against booth time.  That caused visible flicker:
  // every tick the second-screen player saw its currentTime as "wrong"
  // relative to the booth (because they're two independent media
  // elements playing the same file from different buffers), and corrected
  // by setting vid.currentTime — which yanks the picture.  Instead we
  // now just send a message on song change / pause / resume and let
  // each side play at its own pace.  The two players started from the
  // same file at the same time; drift is imperceptible over a 3-4 minute
  // song.
  // NOTE — we do NOT mute the booth in dual mode.  The speakers/amp are
  // physically connected to the booth laptop, so the booth is ALWAYS the
  // audio source.  The TV (second screen) is video-only and stays muted
  // (its YT embed uses mute=1, and its <video>/<audio> elements are muted).
  // An earlier version muted the booth's YouTube here on the assumption the
  // TV carried the sound — that produced silence on YouTube songs.

  React.useEffect(() => {
    function onGoSearch() { setTab('browse'); }
    window.addEventListener('booth-v2-go-search', onGoSearch);
    return () => window.removeEventListener('booth-v2-go-search', onGoSearch);
  }, []);

  // Auto-fullscreen on first user gesture.  Attempting fullscreen without
  // a gesture is silently rejected by the browser.  Once we've satisfied
  // the policy by reacting to a click, also unblock any deferred audio.
  const fullscreenedRef = React.useRef(false);
  React.useEffect(() => {
    function onFirstGesture() {
      if (fullscreenedRef.current) return;
      fullscreenedRef.current = true;
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) {
        try { req.call(el); } catch (e) { console.warn('[booth-v2] fullscreen failed', e); }
      }
      // If we're in DUAL mode and the lyrics window isn't already open (e.g.
      // after a reboot), reopen it now -- this first tap is a real gesture, so
      // window.open is allowed. (openSecondScreenV2 also runs from the admin
      // "Dual screen" button; it closes any existing one first, so no dupes.)
      try {
        if (localStorage.getItem('karaokeScreenMode') === 'dual' && !hasSecondScreen()) {
          openSecondScreenV2();
        }
      } catch (e) { console.warn('[booth-v2] reopen second screen failed', e); }
    }
    document.addEventListener('pointerdown', onFirstGesture, { once: true });
    return () => document.removeEventListener('pointerdown', onFirstGesture);
  }, []);

  // Manual play — used by the explicit ▶ Play button below when the user
  // wants to start (or restart) the queue.
  function startQueue() {
    if (expired) { notifyExpired(); return; }
    if (!playerRef.current) return;
    const q = queueRef.current;
    if (!q.length) return;
    const next = q[0];
    setQueue(rest => rest.slice(1));
    startSong(next);
  }

  // ── Queue and playback actions ─────────────────────────────────
  function startSong(song) {
    console.log('[booth-v2] startSong', song && song.title, 'player=', !!playerRef.current);
    if (!song) { setDebugMsg('startSong: no song'); return; }
    if (!playerRef.current) { setDebugMsg('startSong: player not ready'); return; }
    trackPlay(song);
    playStartRef.current = performance.now();  // perf: time-to-first-play
    setNowPlaying(song);
    // Detect multiplex from the filename (same approach v1 uses).  Player.js
    // also fires a 'multiplexchange' event when it actually inspects the
    // audio tracks, but that arrives later — this gives the vocals toggle a
    // chance to appear immediately for any file with "multiplex" in its name.
    const fn = song.filename || '';
    setHasMultiplex(/multiplex/i.test(fn));
    setVocalsOn(false);  // always start with vocals OFF (karaoke)
    setDebugMsg('starting: ' + (song.title || song.filename));
    playerRef.current.play(song).catch(e => {
      console.warn('[booth-v2] play failed', e);
      setDebugMsg('play failed: ' + (e && e.message || 'unknown'));
    });
  }
  // Toast lifecycle — show for 3s after each add.  Single ref-based timer
  // so a rapid second add cancels the previous toast cleanly.
  const toastTimerRef = React.useRef(null);
  function showAddedToast(song, position) {
    setAddedToast({ song, position });
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setAddedToast(null), 3000);
  }

  function addToQueue(song) {
    console.log('[booth-v2] addToQueue', song && song.title,
                'nowPlaying=', !!nowPlayingRef.current, 'player=', !!playerRef.current);
    if (!song) return;
    // Session over — block any new cue/play (mirrors v1's disabled add buttons).
    if (expired) { notifyExpired(); return; }
    trackAdd(song);
    const item = { ...song, qid: Date.now() + Math.random() };
    setFlash(song.id); setTimeout(() => setFlash(null), 900);
    if (!nowPlayingRef.current && playerRef.current) {
      // Empty queue: kick off playback immediately.
      startSong(item);
      showAddedToast(song, 'now');
    } else {
      setQueue(q => [...q, item]);
      setDebugMsg('queued: ' + (song.title || song.filename));
      // Position in queue = length AFTER the add, which is queue.length + 1
      // (we don't have the post-update length yet from setQueue, so derive
      // from current ref which is still pre-update — add 1 for the new item).
      showAddedToast(song, (queueRef.current.length || 0) + 1);
    }
  }
  function removeFromQueue(qid) { setQueue(q => q.filter(s => s.qid !== qid)); }
  function moveInQueue(fromIdx, toIdx) {
    if (fromIdx === toIdx) return;
    setQueue(q => {
      if (fromIdx < 0 || fromIdx >= q.length) return q;
      const next = q.slice();
      const [item] = next.splice(fromIdx, 1);
      const insertAt = Math.max(0, Math.min(next.length, toIdx));
      next.splice(insertAt, 0, item);
      return next;
    });
  }
  function likeSong(song) {
    if (!song) return;
    if (expired) { notifyExpired(); return; }
    setLiked(L => [song, ...L.filter(s => s.id !== song.id)].slice(0, 10));
    addToQueue(song);
  }
  function previewSong(song) {
    // Preview = play immediately; if there's a current song, push it to the
    // front of the queue so we don't lose it. Also tracks the song in liked
    // history (super-like is a strong taste signal — the user wants it NOW).
    if (!song || !playerRef.current) return;
    if (expired) { notifyExpired(); return; }
    const cur = nowPlayingRef.current;
    if (cur) {
      setQueue(q => [{ ...cur, qid: Date.now() + Math.random() }, ...q]);
    }
    setLiked(L => [song, ...L.filter(s => s.id !== song.id)].slice(0, 10));
    startSong(song);
    showAddedToast(song, 'now');
  }
  function togglePause() {
    if (!playerRef.current) return;
    if (playerRef.current.paused) playerRef.current.resume();
    else playerRef.current.pause();
  }
  function skipNext() {
    if (!playerRef.current) return;
    const q = queueRef.current;
    if (q.length) {
      const next = q[0];
      setQueue(rest => rest.slice(1));
      startSong(next);
    } else {
      playerRef.current.stop();
      setNowPlaying(null);
    }
  }
  function toggleVocals() {
    if (!playerRef.current) return;
    const next = !vocalsOn;
    playerRef.current.setVocalsOn(next);
    setVocalsOn(next);
  }
  function restartCurrent() {
    const np = nowPlayingRef.current;
    if (!np) return;
    // Try player.js first (it may handle this cleanly)…
    if (playerRef.current && playerRef.current.restart) {
      try { playerRef.current.restart(); } catch (e) {}
    }
    // …but also go direct to the media elements as a reliable fallback,
    // mirroring v1.  player.js's restart() doesn't always take effect,
    // especially for YouTube.
    const v = document.getElementById('bvVid');
    const a = document.getElementById('bvAud');
    if (np.ytId) {
      // YouTube: seek the embed back to 0 via the iframe API.
      const yt = document.getElementById('bvYt');
      if (yt && yt.contentWindow) {
        try {
          yt.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: 'seekTo', args: [0, true] }), '*');
          yt.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*');
        } catch (e) {}
      }
      // As a last resort, fully re-start the song through the player.
      if (!yt || !yt.contentWindow) startSong(np);
    } else if (v && v.src && v.readyState > 0) {
      v.currentTime = 0;
      v.play().catch(() => {});
      if (a && a.src) a.currentTime = 0;
    } else if (a && a.src && a.readyState > 0) {
      a.currentTime = 0;
      a.play().catch(() => {});
    } else {
      // Nothing playable found on the elements — just replay the song.
      startSong(np);
    }
    // Keep the second screen in step: in dual mode, force it to reload the
    // current song from the top.  We send a stop then a fresh sync so the
    // second-screen player tears down and rebuilds at time 0.
    if (screenMode === 'dual') {
      sendToSecondScreen({ type: 'stop', venueName });
      setTimeout(() => {
        lastSyncSentRef.current = 0;
        sendToSecondScreen(_buildSyncMsg());
      }, 150);
    }
  }
  // Skip-forward — mirrors v1's seekForward.  Goes direct to the underlying
  // media element since player.js doesn't expose a seek method.
  function seekForward(secs) {
    if (!nowPlaying) return;
    const v = document.getElementById('bvVid');
    const a = document.getElementById('bvAud');
    if (v && v.src && v.readyState > 0) {
      v.currentTime = Math.min(v.duration || 999999, (v.currentTime || 0) + secs);
      return;
    }
    if (a && a.src && a.readyState > 0) {
      a.currentTime = Math.min(a.duration || 999999, (a.currentTime || 0) + secs);
      return;
    }
    // YouTube — postMessage to the embed
    if (nowPlaying.ytId) {
      const yt = document.getElementById('bvYt');
      if (yt && yt.contentWindow) {
        // First get current time, then seek. The YouTube iframe API uses
        // postMessage; we send a "seekTo" command with a slightly-future
        // timestamp.  Without a return channel we approximate by adding to
        // whatever the player thinks is current via the documented command.
        try {
          // Best-effort: send a generic skip using the YT iframe API
          // command format. If player.js wraps YT, this may need to go
          // through it instead — but most embeds accept this directly.
          const p = playerRef.current;
          const cur = (p && p.getCurrentTime) ? p.getCurrentTime() : 0;
          yt.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: 'seekTo', args: [cur + secs, true] }),
            '*'
          );
        } catch (e) {}
      }
    }
  }

  if (!lib.songs) {
    return (
      <div style={{ width: 1280, height: 800, background: '#060309',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: '#a1a1aa', fontSize: 14, letterSpacing: 3, textTransform: 'uppercase' }}>
        Loading library…
      </div>
    );
  }
  if (lib.songs.length === 0) {
    return (
      <div style={{ width: 1280, height: 800, background: '#060309',
        display: 'flex', flexDirection: 'column', alignItems: 'center',
        justifyContent: 'center', gap: 14, padding: 40, textAlign: 'center' }}>
        <div style={{ fontSize: 48 }}>📂</div>
        <div style={{ fontSize: 22, fontWeight: 800 }}>No songs found</div>
        <div style={{ color: '#a1a1aa', maxWidth: 480 }}>
          Check the songs folder in Admin (karaoke-booth.html → Admin) or make sure
          <code style={{ color: '#fbbf24' }}> karaoke_server.py </code>
          can see your karaoke files.
        </div>
      </div>
    );
  }

  const accent = ACCENT[tab];

  return (
    <LangCtx.Provider value={language}>
    <div style={{ width: 1280, height: 800, position: 'relative',
      background: 'radial-gradient(ellipse at 20% 0%, #1a0f1a 0%, #060309 70%)',
      display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

      {/* TOP BAR */}
      <div style={{ height: 60, display: 'flex', alignItems: 'center', padding: '0 24px',
        borderBottom: '1px solid rgba(255,255,255,0.08)', gap: 16, flexShrink: 0 }}>
        {/* Venue logo + name = Home button, back to the category page. */}
        <button onClick={goBrowseHome} title={tr('homeWord', language)} style={{
          display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer',
          background: 'rgba(255,255,255,0.03)', borderRadius: 10,
          border: '1px solid rgba(255,255,255,0.08)',
          padding: '4px 10px 4px 6px', marginLeft: -6,
          font: 'inherit', textAlign: 'left',
        }}>
          {!logoBroken && <img src={logoSrc} alt="" onError={() => setLogoBroken(true)}
            style={{ height: 34, width: 'auto', maxWidth: 150,
              objectFit: 'contain', borderRadius: 6 }}/>}
          <div style={{ fontFamily: 'Georgia, serif', fontStyle: 'italic',
            fontSize: 22, fontWeight: 900,
            background: 'linear-gradient(90deg, #fbbf24, #f472b6, #06b6d4)',
            WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
            ★ {venueName}
          </div>
        </button>
        <div style={{ display: 'flex', gap: 4, background: 'rgba(255,255,255,0.04)',
          borderRadius: 12, padding: 4, border: '1px solid rgba(255,255,255,0.08)', marginLeft: 12 }}>
          {[['browse','🎵',tr('browse',language)],['swipe','✨',tr('swipe',language)],['radio','📡',tr('radio',language)]].map(([k, emoji, label]) => (
            <button key={k} onClick={() => setTab(k)} style={{
              padding: '8px 18px', borderRadius: 8, fontSize: 13, fontWeight: 800,
              background: tab === k ? ACCENT[k]+'33' : 'transparent',
              color: tab === k ? ACCENT[k] : '#9ca3af',
              border: tab === k ? `1px solid ${ACCENT[k]}` : '1px solid transparent',
              cursor: 'pointer', transition: 'all 0.2s',
            }}>{emoji} {label}</button>
          ))}
        </div>
        <div style={{ flex: 1 }} />
        {/* Diagnostic status — visible without DevTools */}
        <div title={debugMsg} style={{
          fontFamily: 'ui-monospace, monospace', fontSize: 11,
          padding: '4px 8px', borderRadius: 6,
          background: debugStatus === 'ready' ? 'rgba(34,197,94,0.15)'
                    : debugStatus === 'init'  ? 'rgba(99,102,241,0.15)'
                    :                            'rgba(239,68,68,0.18)',
          color:      debugStatus === 'ready' ? '#86efac'
                    : debugStatus === 'init'  ? '#a5b4fc'
                    :                            '#fca5a5',
          border: '1px solid currentColor',
          maxWidth: 240, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>
          {debugStatus === 'ready' ? '● ' : '○ '}
          {debugMsg || debugStatus}
        </div>
        <TimerPill timer={timer}/>
        <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 12, color: '#9ca3af' }}>
          {lib.songs.length.toLocaleString()} local
          {lib.yt && lib.yt.all.length > 0 && <span> · <span style={{color:'#06b6d4'}}>{lib.yt.all.length.toLocaleString()} streaming</span></span>}
          {' · '}{queue.length} queued
        </div>
        <button onClick={openAdminGated} title="Admin (PIN required)" style={{
          padding: '6px 10px', borderRadius: 6, background: 'rgba(255,255,255,0.04)',
          border: '1px solid rgba(255,255,255,0.1)', color: '#d1d5db',
          fontSize: 14, cursor: 'pointer',
        }}>⚙</button>
      </div>

      {/* BODY */}
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 340px', minHeight: 0 }}>
        <div style={{ minWidth: 0, overflow: 'hidden', position: 'relative' }}>
          {tab === 'browse' && <BrowseMode lib={filteredLib} addToQueue={addToQueue}
                                           flash={flash} homeSignal={browseHomeSignal}/>}
          {tab === 'swipe'  && <SwipeMode lib={filteredLib} liked={liked} likeSong={likeSong}
                                          previewSong={previewSong}
                                          seenIds={seenIds} markSeen={markSeen}/>}
          {tab === 'radio'  && <RadioMode lib={filteredLib} addToQueue={addToQueue} previewSong={previewSong}/>}
        </div>
        <QueueRail queue={queue} nowPlaying={nowPlaying} paused={paused}
                   remove={removeFromQueue} move={moveInQueue} accent={accent}
                   onPause={togglePause} onSkip={skipNext}
                   onPlay={startQueue} onRestart={restartCurrent}
                   onSeekForward={() => seekForward(5)}
                   hasMultiplex={hasMultiplex} vocalsOn={vocalsOn}
                   onToggleVocals={toggleVocals}
                   volume={volume} onVolume={setVolume}
                   screenMode={screenMode}/>
      </div>

      {adminOpen && <AdminPanel lib={lib} timer={timer} onClose={() => setAdminOpen(false)}
                                  showCdg={showCdg} onToggleShowCdg={toggleShowCdg}
                                  venueName={venueName} setVenueName={setVenueName}
                                  venueTagline={venueTagline} setVenueTagline={setVenueTagline}
                                  logoUrl={logoUrl} setLogoUrl={setLogoUrl}
                                  showWelcome={showWelcome}
                                  reloadLibrary={reloadLibrary}
                                  screenMode={screenMode} setScreenModeSaved={setScreenModeSaved}
                                  openSecondScreen={openSecondScreenV2}
                                  closeSecondScreen={closeSecondScreen}
                                  grantSearches={grantSearches} searchBump={searchBump}/>}
      {welcomeShown && !timer.active && <WelcomeOverlay
        venueName={venueName} venueTagline={venueTagline} logoUrl={logoUrl}
        singerName={singerName} mins={timer.mins}
        language={language} onLanguage={setLanguageSaved}
        onStart={startFromWelcome} onCancel={cancelWelcome}/>}
      {pinPrompt && <PinDialog
                      onCancel={() => setPinPrompt(null)}
                      onSuccess={() => { const f = pinPrompt.onOk; setPinPrompt(null); if (f) f(); }}/>}
      {addedToast && <AddedToast song={addedToast.song} position={addedToast.position}
                                  onDismiss={() => setAddedToast(null)}/>}
      {lockToast && <LockToast onDismiss={() => setLockToast(false)}/>}
    </div>
    </LangCtx.Provider>
  );
}

// ============================================================
// SESSION-ENDED TOAST — shown when a customer tries to add/play after the

          : <div style={{ width: '100%', height: '100%',

      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 2,
          color: '#fbbf24', marginBottom: 4 }}>
          ✓ {position === 'now' ? t('lblPlaying') : t('addedToQueue').replace('{n}', position)}

          {song.artist}

// ============================================================
// TIMER PILL — lives in the top bar
// ============================================================
function TimerPill({ timer }) {
  const t = useTr();
  let border, color, bg, label, icon;
  if (!timer.active) {
    border = '#6366f1'; color = '#a5b4fc'; bg = 'rgba(99,102,241,0.1)';
    label = t('waitingPill'); icon = '⏸';
  } else if (timer.remainingMs <= 0) {
    border = '#ef4444'; color = '#fca5a5'; bg = 'rgba(239,68,68,0.15)';
    label = '0:00:00'; icon = '⏰';
  } else if (timer.remainingMs < 5 * 60 * 1000) {
    border = '#f59e0b'; color = '#fcd34d'; bg = 'rgba(245,158,11,0.12)';
    label = timer.label; icon = '⚠';
  } else {
    border = '#22c55e'; color = '#86efac'; bg = 'rgba(34,197,94,0.1)';
    label = timer.label; icon = '▶';
  }
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '4px 10px', borderRadius: 8, border: `1.5px solid ${border}`,
      background: bg, fontFamily: 'ui-monospace, monospace', fontSize: 12, fontWeight: 800,
      color, letterSpacing: 1,
      boxShadow: `0 0 8px ${border}44`,
    }}>
      <span style={{ fontSize: 10, opacity: 0.85 }}>{icon}</span>
      {label}
    </div>
  );
}

// ============================================================
// VIRTUAL KEYBOARD — on-screen keyboard for touchscreens that don't
// surface an OS soft keyboard.  Three modes: letters (with Shift toggle),
// numbers + common symbols, and full punctuation.  Used both in browse
// search and in admin text inputs.
// Caller controls visibility (open on input focus, close on outside tap).
// ============================================================
function VirtualKeyboard({ value, onChange, onClose, defaultScript }) {
  // Default the script to the selected UI language (한국어 → Korean jamo, etc.),
  // but let the user switch freely via the bar at the top. Admin passes
  // defaultScript="latin" since staff inputs are IPs / URLs / PINs.
  const ctxLang = React.useContext(LangCtx);
  const [script, setScript] = React.useState(() => defaultScript || kbLangToScript(ctxLang));
  const [mode, setMode] = React.useState('letters');  // 'letters' | 'symbols' | 'punct' (Latin-family only)
  const [shift, setShift] = React.useState(false);

  // Latin-family letter rows (QWERTY). 'zh' (pinyin) is the same Latin keys
  // plus a hint — romanization is the standard way to find CJK songs. 'es'
  // adds ñ and an accent row. symbols/punct are shared across the Latin family.
  const KB_LETTER_ROWS = {
    latin: [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l'],
      ['z','x','c','v','b','n','m'],
    ],
    zh: [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l'],
      ['z','x','c','v','b','n','m'],
    ],
    es: [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l','ñ'],
      ['z','x','c','v','b','n','m'],
      ['á','é','í','ó','ú','ü','¡','¿'],
    ],
  };
  // Non-Latin scripts (ported from v1's VKB_LAYOUTS). Like v1, these insert
  // raw jamo / kana — there is NO IME composition into full 한글 / 漢字, so a
  // customer assembles characters key by key. Good enough to enter a query.
  const KB_CJK_ROWS = {
    ko: [
      ['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],
      ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
      ['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ'],
    ],
    ja: [
      ['あ','い','う','え','お','1','2','3','4','5'],
      ['か','き','く','け','こ','6','7','8','9','0'],
      ['さ','し','す','せ','そ','た','ち','つ','て','と'],
      ['な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ'],
      ['ま','み','む','め','も','や','ゆ','よ','ら','り'],
    ],
  };
  const SYM = {
    symbols: [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['@','#','£','$','%','&','*','(',')','-'],
      ['/',':',';','+','=','_','"',"'",'~'],
      ['<','>','€','¥','{','}','[',']','|'],
    ],
    punct: [
      ['.',',','?','!',':',';','-','_','/','\\'],
      ['(',')','[',']','{','}','<','>','&','|'],
      ["'",'"','`','~','@','#','$','%','^','*'],
      ['+','=','£','€','¥','§','¶','•','…','¿'],
    ],
  };
  const KB_SCRIPTS = [['latin','ABC'],['es','Español'],['zh','拼音'],['ko','한국어'],['ja','日本語']];
  const KB_HINTS = { zh: 'Type pinyin, e.g. "ni hao"' };

  const isCjk = script === 'ko' || script === 'ja';

  function tap(k) {
    let ch = k;
    if (!isCjk && mode === 'letters' && shift && /^[a-z]$/.test(k)) ch = k.toUpperCase();
    onChange((value || '') + ch);
    // Auto-untoggle Shift after a single letter (standard mobile behaviour)
    if (!isCjk && mode === 'letters' && shift && /^[a-z]$/.test(k)) setShift(false);
  }
  function back() { onChange((value || '').slice(0, -1)); }
  function clear() { onChange(''); }
  function pickScript(s) { setScript(s); setMode('letters'); setShift(false); }

  const rows = isCjk ? KB_CJK_ROWS[script]
             : mode === 'letters' ? (KB_LETTER_ROWS[script] || KB_LETTER_ROWS.latin)
             : SYM[mode];
  const showShift = !isCjk && mode === 'letters';
  const hint = KB_HINTS[script];

  return (
    <div onClick={e => e.stopPropagation()} style={{
      position: 'absolute', left: 0, right: 0, bottom: 0,
      background: 'linear-gradient(180deg, rgba(15,11,21,0.98), rgba(6,3,9,1))',
      borderTop: '1px solid rgba(255,255,255,0.1)',
      padding: '10px 12px 12px',
      zIndex: 90,
      animation: 'kbSlideUp 0.18s ease-out',
    }}>
      <style>{`@keyframes kbSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }`}</style>

      {/* Top bar: script switcher + (Latin) symbol/punct toggles + Done */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        marginBottom: 8, gap: 8, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', alignItems: 'center' }}>
          {/* Language / script picker (ports v1's layouts). Picking a script
              returns to its letters view. */}
          {KB_SCRIPTS.map(([k, label]) => {
            const on = script === k;
            return (
              <button key={k} onClick={() => pickScript(k)} style={{
                padding: '5px 12px', borderRadius: 6, fontSize: 11, letterSpacing: 0.5,
                background: on ? 'rgba(6,182,212,0.25)' : 'rgba(255,255,255,0.04)',
                border: `1px solid ${on ? 'rgba(6,182,212,0.5)' : 'rgba(255,255,255,0.1)'}`,
                color: on ? '#67e8f9' : '#9ca3af',
                cursor: 'pointer', fontWeight: 700,
              }}>{label}</button>
            );
          })}
          {/* Symbols / punctuation — Latin family only */}
          {!isCjk && [['symbols','#+@'],['punct','.?!']].map(([k, label]) => {
            const on = mode === k;
            return (
              <button key={k} onClick={() => setMode(m => m === k ? 'letters' : k)} style={{
                padding: '5px 12px', borderRadius: 6, fontSize: 11, letterSpacing: 1,
                background: on ? 'rgba(251,191,36,0.25)' : 'rgba(255,255,255,0.04)',
                border: `1px solid ${on ? 'rgba(251,191,36,0.5)' : 'rgba(255,255,255,0.1)'}`,
                color: on ? '#fcd34d' : '#9ca3af',
                cursor: 'pointer', fontWeight: 700,
              }}>{label}</button>
            );
          })}
          {hint && <span style={{ fontSize: 10, color: '#71717a', marginLeft: 2 }}>{hint}</span>}
        </div>
        <button onClick={onClose} style={{
          padding: '5px 14px', borderRadius: 6, fontSize: 11, letterSpacing: 1,
          background: 'rgba(34,197,94,0.2)',
          border: '1px solid rgba(34,197,94,0.4)',
          color: '#86efac', cursor: 'pointer', fontWeight: 700,
        }}>✓ DONE</button>
      </div>

      {/* Key rows */}
      {rows.map((row, ri) => (
        <div key={ri} style={{ display: 'flex', gap: 3, marginBottom: 3,
          paddingLeft: !isCjk && mode === 'letters' && ri === 2 ? 14 : 0,
          paddingRight: !isCjk && mode === 'letters' && ri === 2 ? 14 : 0,
          justifyContent: 'center',
        }}>
          {/* Shift key on the left of the bottom letter row */}
          {showShift && ri === 3 && (
            <button onClick={() => setShift(s => !s)} style={{
              ...kbKeyStyle(),
              flex: 1.4,
              background: shift ? 'rgba(251,191,36,0.3)' : 'rgba(255,255,255,0.07)',
              borderColor: shift ? 'rgba(251,191,36,0.5)' : 'rgba(255,255,255,0.12)',
              color: shift ? '#fcd34d' : 'white',
              fontWeight: 800,
            }}>⇧</button>
          )}
          {row.map(k => {
            const display = (!isCjk && mode === 'letters' && shift && /^[a-z]$/.test(k)) ? k.toUpperCase() : k;
            return (
              <button key={k} onClick={() => tap(k)} style={kbKeyStyle()}>{display}</button>
            );
          })}
          {/* Backspace on the right of the bottom letter row */}
          {showShift && ri === 3 && (
            <button onClick={back} style={{ ...kbKeyStyle(), flex: 1.4,
              background: 'rgba(239,68,68,0.2)', borderColor: 'rgba(239,68,68,0.4)' }}>⌫</button>
          )}
        </div>
      ))}

      {/* Bottom: Clear / space / backspace (when not on letters mode where ⌫ is inline) */}
      <div style={{ display: 'flex', gap: 3, marginTop: 4 }}>
        <button onClick={clear} style={{ ...kbKeyStyle(), flex: 1,
          background: 'rgba(255,255,255,0.04)', fontSize: 12, fontWeight: 700,
          letterSpacing: 1 }}>CLR</button>
        <button onClick={() => tap(' ')} style={{ ...kbKeyStyle(), flex: 6,
          fontSize: 13, fontWeight: 700 }}>␣ space</button>
        {!showShift && (
          <button onClick={back} style={{ ...kbKeyStyle(), flex: 1,
            background: 'rgba(239,68,68,0.2)', borderColor: 'rgba(239,68,68,0.4)' }}>⌫</button>
        )}
        {showShift && (
          <button onClick={() => tap('.')} style={{ ...kbKeyStyle(), flex: 1,
            fontSize: 18, fontWeight: 700 }}>.</button>
        )}
      </div>
    </div>
  );
}
function kbKeyStyle() {
  return {
    flex: 1, padding: '12px 0', borderRadius: 6,
    background: 'rgba(255,255,255,0.07)',
    border: '1px solid rgba(255,255,255,0.12)',
    color: 'white', fontSize: 15, fontWeight: 700,
    cursor: 'pointer',
    fontFamily: 'system-ui, sans-serif',
    minWidth: 24,
    touchAction: 'manipulation',
    WebkitTapHighlightColor: 'transparent',
  };
}
// Maps the selected UI language to a default keyboard script. Anything without
// its own script (English/Français/Deutsch/Italiano/Português) uses Latin.
function kbLangToScript(lang) {
  return ({ '中文': 'zh', '한국어': 'ko', '日本語': 'ja', 'Español': 'es' })[lang] || 'latin';
}

// ============================================================
// WELCOME OVERLAY — full-screen "How to use the booth" walkthrough shown
// when admin has set up a session but the customer hasn't started yet.
// Ported from tutorial.html: a 7-slide horizontal deck (Welcome, Browse,
// Swipe, Radio, Streaming, Mic warning, Done) with dots / Back / Next and
// swipe-to-advance.  Finishing (Start singing / the ✕ skip / Next on the
// last slide) calls onStart, which starts the session timer.
//
// The deck markup is injected via dangerouslySetInnerHTML (a near-verbatim
// copy of tutorial.html's slides) and driven by a ref effect, so we don't
// have to hand-convert every inline style="" into a JSX style object.
// ============================================================
function WelcomeOverlay({ venueName, venueTagline, logoUrl, singerName, mins, language, onLanguage, onStart, onCancel }) {
  const rootRef = React.useRef(null);
  // onStart changes identity on every App render (the session timer ticks
  // once a second), so keep it in a ref instead of a nav-effect dependency -
  // otherwise the effect re-runs every second and resets the deck to slide 1.
  const onStartRef = React.useRef(onStart);
  React.useEffect(() => { onStartRef.current = onStart; }, [onStart]);
  const onLanguageRef = React.useRef(onLanguage);
  React.useEffect(() => { onLanguageRef.current = onLanguage; }, [onLanguage]);
  // Translation helper for the deck. The HTML string below depends on
  // `language` and on the venue, logo, singer name and session minutes; the
  // nav effect further down re-wires whenever that string changes. The
  // per-second timer re-render produces an identical string, so React leaves
  // the DOM alone. slideRef remembers the current slide across re-injection.
  const T = k => tr(k, language);
  const slideRef = React.useRef(0);

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const m = Number(mins) > 0 ? Number(mins) : 60;
  // Staff sometimes type a placeholder into the hub's optional name box, and
  // "Welcome, N/A!" reads as a glitch on the customer's very first screen.
  const guest = /^\s*(n\/?a|none|null|undefined|tbc|tba|-+|\.+|\?+)\s*$/i.test(singerName || '')
    ? '' : singerName;
  const hello = guest
    ? T('wWelcomeName').replace('{name}', '<b style="color:#fbbf24">' + esc(guest) + '</b>')
    : '';
  const langBtns = LANG_OPTIONS.map(l =>
    '<button class="wv-lang' + (l === language ? ' active' : '') +
    '" data-lang="' + esc(l) + '">' + esc(l) + '</button>'
  ).join('');

  const HTML = `

  // Wire up navigation whenever the markup is (re)injected.
  //
  // The deck is plain HTML set through dangerouslySetInnerHTML, with vanilla
  // listeners attached here. Whenever that HTML string changes - a language
  // pick, but also the singer name or session minutes arriving from the bar
  // hub while the tour is already open - React throws the old nodes away and
  // injects new ones, taking any listeners with them. This effect used to be
  // keyed on [language] only, so a name or minutes change left the new
  // Next/Back buttons with no listeners and the tour froze on slide 1 (filmed
  // at the venue, 2026-09-10). Keyed on the markup itself it re-wires on
  // every change, and slideRef returns the customer to their slide. A layout
  // effect, so the fresh nodes never paint on slide 1 first.
  React.useLayoutEffect(() => {
    const root = rootRef.current;
    if (!root) return;
    const deck = root.querySelector('#wv-deck');
    const dots = root.querySelector('#wv-dots');
    const prev = root.querySelector('#wv-prev');
    const next = root.querySelector('#wv-next');
    const progress = root.querySelector('#wv-progress');
    if (!deck || !dots || !prev || !next || !progress) return;
    const slides = deck.querySelectorAll('.wv-slide');
    const total = slides.length;
    const SLIDE_W = 1280;  // booth container is a fixed 1280px wide
    let i = 0;

    dots.innerHTML = '';
    const dotEls = [];
    for (let k = 0; k < total; k++) {
      const d = document.createElement('div');
      d.className = 'wv-dot';
      d.addEventListener('click', () => go(k));
      dots.appendChild(d);
      dotEls.push(d);
    }
    function go(n) {
      i = Math.max(0, Math.min(total - 1, n));
      slideRef.current = i;
      deck.style.transform = 'translateX(' + (-i * SLIDE_W) + 'px)';
      dotEls.forEach((d, k) => d.classList.toggle('active', k === i));
      prev.disabled = i === 0;
      next.textContent = i === total - 1 ? ('🎤 ' + T('wStart')) : (T('wNext') + ' →');
      progress.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
    }
    const start = () => onStartRef.current && onStartRef.current();
    function goNext() { if (i >= total - 1) start(); else go(i + 1); }
    const onPrev = () => go(i - 1);
    prev.addEventListener('click', onPrev);
    next.addEventListener('click', goNext);
    const finalBtn = root.querySelector('#wv-finalStart');
    if (finalBtn) finalBtn.addEventListener('click', start);

    function onKey(e) {
      if (e.key === 'ArrowRight') goNext();
      else if (e.key === 'ArrowLeft') go(i - 1);
    }
    document.addEventListener('keydown', onKey);

    // Swipe-to-advance for the touchscreen.
    let sx = null, sy = null;
    function ps(e) { sx = e.clientX; sy = e.clientY; }
    function pe(e) {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      sx = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) goNext(); else go(i - 1);
      }
    }
    deck.addEventListener('pointerdown', ps);
    deck.addEventListener('pointerup', pe);

    // Language picker (event-delegated so it works regardless of how many
    // buttons there are). Toggles the active highlight in plain JS and pushes
    // the choice up to App, which persists it and re-renders the chrome.
    const langBar = root.querySelector('#wv-langs');
    function onLangClick(e) {
      const btn = e.target.closest('[data-lang]');
      if (!btn || !langBar) return;
      const lang = btn.getAttribute('data-lang');
      langBar.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b === btn));
      if (onLanguageRef.current) onLanguageRef.current(lang);
    }
    if (langBar) langBar.addEventListener('click', onLangClick);

    go(slideRef.current);
    return () => {
      document.removeEventListener('keydown', onKey);
      prev.removeEventListener('click', onPrev);
      next.removeEventListener('click', goNext);
      deck.removeEventListener('pointerdown', ps);
      deck.removeEventListener('pointerup', pe);
      if (langBar) langBar.removeEventListener('click', onLangClick);
    };
  }, [HTML]);

  return (
    <div ref={rootRef} className="wv-stage"
         dangerouslySetInnerHTML={{ __html: HTML }} />
  );
}
