          </div>
          <div key="browse-home" ref={setHomeScrollRef}
            style={{ flex: 1, minHeight: 0, overflowY: 'auto', paddingRight: 4,
              display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 12,
              alignContent: 'start',
              touchAction: 'pan-y',
              WebkitOverflowScrolling: 'touch',
              overscrollBehavior: 'contain',
              cursor: 'grab',
            }}>
            {cats.map(c => (
              <CategoryTile key={c} name={c} count={catCounts[c] || 0}
                onClick={() => openCategory(c)}/>
            ))}
            {/* All songs — same footprint as a category so the grid stays even. */}
            <button onClick={() => { setHome(false); setCat(null); setLetter(null); }}
              style={{ padding: 0, width: '100%', aspectRatio: 1, borderRadius: 12,
                border: '1.5px dashed rgba(251,191,36,0.45)', cursor: 'pointer',
                background: 'rgba(251,191,36,0.06)', color: '#fbbf24',
                display: 'flex', flexDirection: 'column', gap: 6,
                alignItems: 'center', justifyContent: 'center' }}>
              <span style={{ fontSize: 40 }}>🎵</span>
              <span style={{ fontSize: 13, fontWeight: 800 }}>{t('allSongs')}</span>
              <span style={{ fontSize: 10, opacity: 0.75 }}>
                {lib.songs.length.toLocaleString()}{' '}
                {t(lib.songs.length === 1 ? 'songWord' : 'songsWord')}
              </span>
            </button>
          </div>
          <div style={{ flexShrink: 0, marginBottom: -8, fontSize: 11,
            fontWeight: 800, letterSpacing: 1.5, color: '#8b8b94' }}>
            {t('browseByArtist')}
          </div>
          {letterStrip}
        </React.Fragment>
      )}

      {/* Grid — key changes on filter change so the div is freshly remounted
          and the scrollbar always starts at the top.  Explicit pointer/wheel
          properties make sure mouse-wheel scrolling works on desktop test
          machines without a touchscreen (some parent layouts can otherwise
          swallow wheel events through default behaviour).
          Home vs grid keys off deferredSearch, not search: while a search is
          catching up the home tiles stay on screen, rather than the grid
          mounting for a frame with the whole library behind it. */}
      {(!home || !!deferredSearch) && (
      <div key={gridKey} ref={setGridScrollRef}
        style={{ flex: 1, minHeight: 0, overflowY: 'auto', paddingRight: 4,
        touchAction: 'pan-y',
        WebkitOverflowScrolling: 'touch',
        overscrollBehavior: 'contain',
        cursor: 'grab',
      }}>
        {list.length === 0 ? (
          <div style={{ padding: 40, textAlign: 'center', color: '#a1a1aa',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
            <div>{t('noMatchesFor')} "{deferredSearch}"</div>
            {/* Never a dead end: the one thing that can still find it is one tap away. */}
            {sessionSearchInfo().remaining > 0 && (
              <button onClick={e => { e.stopPropagation(); runYtSearch(); }}
                disabled={ytLoading}
                style={{ padding: '12px 22px', borderRadius: 10, border: 'none',
                  background: ytLoading ? 'rgba(6,182,212,0.3)' : 'rgba(6,182,212,0.65)',
                  color: 'white', fontWeight: 800, fontSize: 14,
                  cursor: ytLoading ? 'wait' : 'pointer' }}>
                {ytLoading ? ('⏳ ' + t('searching')) : ('📡 ' + t('searchStreaming') + ' →')}
              </button>
            )}
          </div>
        ) : (
          groups.map(g => (
            <div key={g.key}>
              {g.label && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 8,
                  padding: '2px 0 8px', fontSize: 11, fontWeight: 800,
                  letterSpacing: 1.2, textTransform: 'uppercase', color: g.color }}>
                  <span>{g.icon}</span>{g.label}
                  <span style={{ color: '#6b7280', letterSpacing: 0 }}>{g.items.length}</span>
                  <span style={{ flex: 1, height: 1, background: 'rgba(255,255,255,0.08)' }}/>
                </div>
              )}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)',
                gap: 12, marginBottom: g.label ? 18 : 0 }}>
                {g.items.map(s => {
                  const added = flash === s.id;
                  return (
                    <div key={s.id} onClick={() => addToQueue(s)} style={{
                      cursor: 'pointer', borderRadius: 10, overflow: 'hidden',
                      position: 'relative', aspectRatio: 1,
                      transform: added ? 'scale(1.04)' : 'scale(1)',
                      transition: 'transform 0.25s',
                    }}>
                      <RealArtTile song={s} size={140} style={{ width: '100%', height: '100%' }} showMeta/>
                      {added && (
                        <div style={{ position: 'absolute', inset: 0,
                          background: 'rgba(34,197,94,0.5)', display: 'flex',
                          alignItems: 'center', justifyContent: 'center',
                          fontSize: 56, animation: 'pulse 0.4s' }}>✓</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))
        )}
        {allSongsView && list.length > shownCount && (
          <button onClick={() => setShownCount(n => n + ALL_SONGS_PAGE)}
            style={{ display: 'block', margin: '16px auto 4px', padding: '12px 26px',
              borderRadius: 10, border: '1px solid rgba(251,191,36,0.45)',
              background: 'rgba(251,191,36,0.1)', color: '#fbbf24',
              fontWeight: 800, fontSize: 14, cursor: 'pointer' }}>
            +{Math.min(ALL_SONGS_PAGE, list.length - shownCount).toLocaleString()} {t('moreSuffix')}
            <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 700, opacity: 0.75 }}>
              {shownCount.toLocaleString()} / {list.length.toLocaleString()}
            </span>
          </button>
        )}
      </div>
      )}
      {/* Virtual keyboard — slides up from the bottom when search is active */}
      {kbOpen && (
        <VirtualKeyboard value={search} onChange={setSearch}
          onClose={() => setKbOpen(false)}/>
      )}
    </div>
  );
}

// ============================================================
// SWIPE — taste deck + wildcards, driven by real categories
// ============================================================
function SwipeMode({ lib, liked, likeSong, previewSong, seenIds, markSeen }) {
  const t = useTr();
  const accent = '#a855f7';
  const sub = '#a1a1aa'; const border = 'rgba(255,255,255,0.1)';

  const lastLike = liked[0];

  // Similar pool: local songs + YT items in matching categories, else popular ones
  // pickedCat overrides the "tuned to your taste" pool with songs from a
  // specific category — driven by the new Discover column on the left.
  const [pickedCat, setPickedCat] = React.useState(null);

  // Track songs the user has already swiped past — comes from App so the
  // history survives tab switches (Browse → Swipe shouldn't restart the deck).
  // Resets only on page reload.

  // Fisher-Yates shuffle helper — used so the deck doesn't appear in
  // alphabetical order (lib.songs comes from the server in name order).
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const { pool, wildcards, tagLabels, discover } = React.useMemo(() => {
    const all = [...lib.songs, ...((lib.yt && lib.yt.all) || [])];
    let similar;
    let tagLabels;
    if (pickedCat) {
      // Manual override from the Discover column
      tagLabels = [pickedCat];
      similar = all.filter(s => (s.categories || []).includes(pickedCat));
    } else if (lastLike && (lastLike.categories || []).length) {
      const cats = new Set(lastLike.categories);
      tagLabels = [...cats].slice(0, 2);
      similar = all.filter(s => (s.categories || []).some(c => cats.has(c)) &&
                                 s.id !== lastLike.id);
    } else {
      tagLabels = [t('picksForTonight')];
      // Don't just take the first 80 (alphabetical) — sample randomly from
      // the whole library so the deck doesn't always start with A-artists.
      similar = shuffle(all).slice(0, 200);
    }
    // Exclude songs the user has already liked, AND songs already seen in
    // this session — keeps the deck fresh as they swipe through.
    similar = similar.filter(s => !liked.find(l => l.id === s.id) && !seenIds.has(s.id));
    // Interleave local + YT so streaming songs aren't buried at the end
    const ytHits = similar.filter(s => s.isYt);
    const localHits = similar.filter(s => !s.isYt);
    const mixed = [];
    const maxLen = Math.max(localHits.length, ytHits.length);
    for (let i = 0; i < maxLen; i++) {
      if (i < localHits.length) mixed.push(localHits[i]);
      if (i < ytHits.length && i % 3 === 2) mixed.push(ytHits[i]);
    }
    // Final shuffle so the deck order isn't deterministic by source-list
    // position — every refresh feels different.
    const shuffledPool = shuffle(mixed).slice(0, 60);
    // Wildcards: songs whose categories DON'T overlap with the current focus
    const focusCats = new Set(tagLabels);
    let wild;
    wild = all.filter(s => (s.categories || []).length &&
                            !(s.categories || []).some(c => focusCats.has(c)));
    // Shuffle so wildcards aren't the same every load
    wild = shuffle(wild).slice(0, 4);

    // Discover: pick 4 random categories from the library that AREN'T the
    // current focus.  These go in the left column as off-topic mood
    // suggestions; clicking one repoints the pool via setPickedCat().
    const allCats = (lib.categories || []).filter(c => !focusCats.has(c));
    const shuffledCats = shuffle(allCats).slice(0, 4);
    const disco = shuffledCats.map(c => {
      const sample = all.filter(s => (s.categories || []).includes(c)).slice(0, 1)[0] || null;
      return { name: c, sample };
    });

    return { pool: shuffledPool, wildcards: wild, tagLabels, discover: disco };
  }, [lib.songs, lib.yt, lib.categories, liked, lastLike, pickedCat, seenIds]);

  // Random starting card so users don't see the same first song every time.
  // Lazy-init the state so we only roll once per mount, not every render.
  const [idx, setIdx] = React.useState(() =>
    Math.floor(Math.random() * Math.max(pool.length, 1))
  );
  const [offset, setOffset] = React.useState(0);
  const [offsetY, setOffsetY] = React.useState(0);  // upward = super-like
  const [action, setAction] = React.useState(null);

  const current = pool[idx % (pool.length || 1)];
  const next    = pool[(idx + 1) % (pool.length || 1)];

  function go(kind) {
    if (!current) return;
    setAction(kind);
    // Remember this card so the deck doesn't show it again in this session
    // (whether passed or queued).
    const curId = current.id;
    markSeen(curId);
    if (kind === 'add') likeSong(current);
    if (kind === 'super') {
      trackSuper(current);
      // Super-like: jumps the queue and plays this song RIGHT NOW.
      // previewSong does everything we need: adds to liked history,
      // pushes the currently-playing song back to the top of the queue,
      // starts the new song, and shows the toast.
      if (previewSong) previewSong(current);
    }
    // Hold the stamp animation a touch longer for super so the user
    // gets a satisfying flash.
    const hold = kind === 'super' ? 600 : 340;
    setTimeout(() => { setIdx(i => i + 1); setAction(null); setOffset(0); setOffsetY(0); }, hold);
  }
  // Mouse-wheel navigation through the deck — desktop testers without a
  // touchscreen can spin the wheel to flip through cards.  Throttled so
  // a single trackpad gesture doesn't fly through 50 cards.
  const wheelLockRef = React.useRef(0);
  function onDeckWheel(e) {
    e.preventDefault();
    const now = performance.now();
    if (now - wheelLockRef.current < 220) return;  // throttle
    wheelLockRef.current = now;
    if (e.deltaY > 0)      setIdx(i => i + 1);     // wheel down → next
    else if (e.deltaY < 0) setIdx(i => Math.max(0, i - 1));  // wheel up → back
  }

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column',
      padding: 18, gap: 10, minHeight: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
        <div style={{ fontSize: 12, color: sub, letterSpacing: 2, textTransform: 'uppercase',
          fontWeight: 700 }}>{t('tunedToTaste')}</div>
        <div style={{ flex: 1 }} />
        <div style={{ display: 'flex', gap: 4 }}>
          {tagLabels.map((t, i) => (
            <div key={t} style={{
              padding: '4px 10px', borderRadius: 999, fontSize: 10,
              background: i === 0 ? accent+'33' : 'rgba(255,255,255,0.06)',
              border: `1px solid ${i === 0 ? accent : border}`, color: 'white', fontWeight: 700,
            }}>{t}</div>
          ))}
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '180px 1fr 180px', gap: 18,
        flex: 1, minHeight: 0 }}>

        {/* DISCOVER — left column with off-topic category suggestions.
            Click jumps the swipe pool to that category. */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, minHeight: 0 }}>
          <div style={{ fontSize: 10, color: '#06b6d4', letterSpacing: 2, fontWeight: 800,
            textTransform: 'uppercase' }}>🧭 {t('discover')}</div>
          <div style={{ fontSize: 10, color: sub, marginTop: -4, lineHeight: 1.3 }}>
            {t('changeVibe')}
          </div>
          {pickedCat && (
            <button onClick={() => { setPickedCat(null); setIdx(0); }} style={{
              padding: '6px 8px', fontSize: 10, fontWeight: 700,
              background: 'rgba(255,255,255,0.05)', border: `1px solid ${border}`,
              borderRadius: 6, color: '#06b6d4', cursor: 'pointer',
            }}>↩ {t('backToTaste')}</button>
          )}
          <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 8 }}>
            {discover.map(d => {
              const ds = styleForCat(d.name);
              const isActive = pickedCat === d.name;
              return (
                <div key={d.name}
                  onClick={() => { setPickedCat(d.name); setIdx(0); }}
                  style={{
                    cursor: 'pointer', borderRadius: 8, padding: 8,
                    border: `1px solid ${isActive ? '#06b6d4' : border}`,
                    background: isActive
                      ? `linear-gradient(135deg, oklch(0.32 0.18 ${ds.hue}/0.6), oklch(0.18 0.1 ${ds.hue}/0.4))`
                      : `linear-gradient(135deg, oklch(0.22 0.14 ${ds.hue}/0.4), oklch(0.12 0.08 ${ds.hue}/0.2))`,
                    display: 'flex', flexDirection: 'column', gap: 4,
                  }}>
                  <div style={{ fontSize: 22 }}>{ds.emoji}</div>
                  <div style={{ fontSize: 12, fontWeight: 800, lineHeight: 1.15 }}>{d.name}</div>
                  {d.sample && (
                    <div style={{ fontSize: 9, color: sub, lineHeight: 1.2,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {t('eg')} {d.sample.title}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* CARD */}
        <div onWheel={onDeckWheel}
          title="Drag, click buttons, or scroll wheel to flip cards"
          style={{ position: 'relative', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 14, minHeight: 0 }}>
          <div style={{ position: 'relative', width: 340, height: 460, flexShrink: 0 }}>
            {next && <SwipeCard song={next} peek/>}
            {current && <SwipeCard
              song={current} action={action} offset={offset} offsetY={offsetY}
              onDrag={setOffset} onDragY={setOffsetY} onSwipe={go}/>}
            {!current && (
              <div style={{ position: 'absolute', inset: 0, display: 'flex',
                flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                gap: 12, color: sub, border: `1px dashed ${border}`, borderRadius: 16 }}>
                <div style={{ fontSize: 48 }}>🎉</div>
                <div>{t('wholeShelf')}</div>
                <button onClick={() => setIdx(0)} style={{
                  padding: '8px 16px', borderRadius: 999, background: accent,
                  border: 'none', color: 'white', fontWeight: 700, cursor: 'pointer' }}>
                  {t('tryAnotherShelf')}
                </button>
              </div>
            )}
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
            <SwipeBtn icon="✕" label={t('pass')} color="#ef4444" onClick={() => go('skip')}/>
            <SwipeBtn icon="▶" label={t('preview')} color="white"
                      onClick={() => { if (current && previewSong) previewSong(current); }}/>
            <SwipeBtn icon="♥" label={t('addToQueue')} color="#22c55e" big onClick={() => go('add')}/>
            <SwipeBtn icon="⭐" label={t('superLike')} color="#fbbf24"
                      onClick={() => go('super')}/>
          </div>
          <div style={{ fontSize: 10, color: sub, opacity: 0.7, marginTop: 2 }}>
            {t('swipeTip')}
          </div>
          <div style={{ display: 'flex', gap: 6, fontSize: 10, color: sub }}>
            <Pill onClick={() => setIdx(i => i + 10)}>⏭ {t('skip10')}</Pill>
            <Pill onClick={() => {
              // "New shelf" = re-roll the random starting card and reset
              // wildcards/discover by mutating liked (cheap signal that
              // the useMemo deps change).  We just bump idx to a fresh
              // random offset within the pool.
              setIdx(Math.floor(Math.random() * Math.max(pool.length, 1)));
            }}>⇄ {t('newShelf')}</Pill>
            <Pill onClick={() => {
              // Jump back to the Browse tab where there's a real search box.
              const evt = new CustomEvent('booth-v2-go-search');
              window.dispatchEvent(evt);
            }}>⌕ {t('searchWord')}</Pill>
          </div>
        </div>

        {/* WILDCARDS */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, minHeight: 0 }}>
          <div style={{ fontSize: 10, color: '#fbbf24', letterSpacing: 2, fontWeight: 800,
            textTransform: 'uppercase' }}>✨ {t('wildcards')}</div>
          <div style={{ fontSize: 10, color: sub, marginTop: -4, lineHeight: 1.3 }}>
            {t('unlikeUsual')}
          </div>
          <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 8 }}>
            {wildcards.map(s => (
              <div key={s.id} onClick={() => likeSong(s)} style={{
                cursor: 'pointer', borderRadius: 8, overflow: 'hidden',
                position: 'relative', border: '1px dashed rgba(251,191,36,0.35)',
                background: 'rgba(251,191,36,0.04)', padding: 4,
              }}>
                <RealArtTile song={s} size={100}
                  style={{ width: '100%', height: 100, borderRadius: 6 }} showMeta/>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        fontSize: 11, color: sub, paddingTop: 6, borderTop: `1px solid ${border}`, flexShrink: 0 }}>
        <span>{t('becauseYouLiked')} <b style={{color:'white'}}>{lastLike?.title || ('— ' + t('pickSomethingFirst'))}</b>
          {liked.length > 1 && <span> +{liked.length-1} {t('moreSuffix')}</span>}
        </span>
        <span>{liked.length} {t('likedWord')} · {Math.max(0, pool.length - (idx % (pool.length||1)))} {t('leftWord')}</span>
      </div>
    </div>
  );
}

function SwipeCard({ song, peek, action, offset = 0, offsetY = 0, onDrag, onDragY, onSwipe }) {
  const art = useArt(song);
  const g = gradientFor(song, 300);
  const start = React.useRef(null);   // {x, y} on pointer down

  // Build the transform string based on which gesture is active.  An
  // outward "super" leaves the card flying upward instead of sideways.
  let transform;
  if (peek) {
    transform = 'scale(0.94) translateY(14px)';
  } else if (action === 'add') {
    transform = 'translateX(420px) rotate(16deg)';
  } else if (action === 'skip') {
    transform = 'translateX(-420px) rotate(-16deg)';
  } else if (action === 'super') {
    // Fly up + scale up + slight tilt for the "super" feel.
    transform = 'translateY(-560px) scale(1.05) rotate(-4deg)';
  } else {
    // Live drag — tilt scales with horizontal offset, vertical lift on Y.
    transform = `translate(${offset}px, ${Math.min(0, offsetY)}px) rotate(${offset * 0.04}deg)`;
  }

  return (
    <div
      onPointerDown={e => {
        if (peek || action) return;
        start.current = { x: e.clientX, y: e.clientY };
        e.currentTarget.setPointerCapture(e.pointerId);
      }}
      onPointerMove={e => {
        if (!start.current) return;
        onDrag && onDrag(e.clientX - start.current.x);
        onDragY && onDragY(e.clientY - start.current.y);
      }}
      onPointerUp={e => {
        if (start.current) {
          const dx = e.clientX - start.current.x;
          const dy = e.clientY - start.current.y;
          // Vertical first — upward swipe (dy < -100) wins over horizontal.
          if (dy < -100 && Math.abs(dy) > Math.abs(dx)) onSwipe && onSwipe('super');
          else if (dx > 80) onSwipe && onSwipe('add');
          else if (dx < -80) onSwipe && onSwipe('skip');
          else { onDrag && onDrag(0); onDragY && onDragY(0); }
        }
        start.current = null;
      }}
      style={{ position: 'absolute', inset: 0, borderRadius: 18, overflow: 'hidden',
        background: '#000',
        boxShadow: action === 'super'
          ? '0 24px 80px rgba(251,191,36,0.5), 0 0 0 2px rgba(251,191,36,0.7)'
          : peek ? '0 8px 20px rgba(0,0,0,0.4)'
          : '0 16px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08)',
        transform,
        opacity: peek ? 0.45 : (action && action !== 'super' ? 0 : 1),
        transition: action ? 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1.2), opacity 0.4s, box-shadow 0.3s'
          : (!start.current ? 'transform 0.2s' : 'none'),
        zIndex: peek ? 1 : 2, cursor: peek ? 'default' : 'grab', touchAction: 'none',
      }}>
      {art ? (
        <>
          <img src={art} alt="" draggable="false" style={{
            position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover',
            filter: 'blur(40px) brightness(0.55)', transform: 'scale(1.2)',
          }}/>
          <img src={art} alt="" draggable="false" style={{
            position: 'absolute', left: '50%', top: '28%', transform: 'translate(-50%, -50%)',
            width: '80%', aspectRatio: 1, objectFit: 'cover', borderRadius: 12,
            boxShadow: '0 12px 32px rgba(0,0,0,0.6)',
          }}/>
        </>
      ) : (
        <div style={{ ...g.style, position: 'absolute', inset: 0, borderRadius: 0 }}>
          <div style={g.stripe}/>
        </div>
      )}
      <div style={{ position: 'absolute', top: 14, left: 16, right: 16, zIndex: 2,
        display: 'flex', justifyContent: 'space-between',
        fontFamily: 'ui-monospace, monospace', fontSize: 10, opacity: 0.85, letterSpacing: 1 }}>
        <span>{(song.categories || [])[0] || song.code || '—'}</span>
        <span>{song.duration || ''}</span>
      </div>
      <div style={{ position: 'absolute', left: 20, right: 20, bottom: 24, zIndex: 2,
        textShadow: '0 2px 12px rgba(0,0,0,0.8)' }}>
        <div style={{ fontSize: 26, fontWeight: 900, lineHeight: 1.05, marginTop: 4 }}>{song.title}</div>
        <div style={{ fontSize: 15, opacity: 0.95, marginTop: 2 }}>{song.artist}</div>
      </div>
      {/* Live preview stamps — only show during a drag, suppressed once
          the action animation kicks in so we don't double up. */}
      {!peek && action !== 'super' && (offset > 40 || action === 'add') && <Stamp kind="add"/>}
      {!peek && action !== 'super' && (offset < -40 || action === 'skip') && <Stamp kind="skip"/>}
      {!peek && (offsetY < -50 || action === 'super') && <Stamp kind="super"/>}
      {/* Sparkle layer overlays the whole card during super-like for that
          extra-celebratory flash. */}
      {action === 'super' && <SuperSparkles/>}
    </div>
  );
}

function Stamp({ kind }) {
  const t = useTr();
  if (kind === 'super') {
    return (
      <div style={{ position: 'absolute', zIndex: 4, inset: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        pointerEvents: 'none' }}>
        <div style={{
          padding: '10px 22px', fontSize: 36, fontWeight: 900, letterSpacing: 4,
          color: '#111',
          background: 'linear-gradient(90deg, #fbbf24, #f472b6, #06b6d4)',
          borderRadius: 14,
          boxShadow: '0 10px 40px rgba(251,191,36,0.6), 0 0 0 4px rgba(251,191,36,0.4)',
          animation: 'superPop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.4) forwards',
        }}>⭐ SUPER ⭐</div>
        <style>{`@keyframes superPop {
          0%   { transform: scale(0.4) rotate(-8deg); opacity: 0; }
          40%  { transform: scale(1.15) rotate(2deg); opacity: 1; }
          100% { transform: scale(1) rotate(-3deg); opacity: 1; }
        }`}</style>
      </div>
    );
  }
  const add = kind === 'add';
  return <div style={{ position: 'absolute', zIndex: 3,
    top: 36, left: add ? 'auto' : 24, right: add ? 24 : 'auto',
    transform: `rotate(${add ? -12 : 12}deg)`,
    border: `4px solid ${add ? '#22c55e' : '#ef4444'}`,
    color: add ? '#22c55e' : '#ef4444',
    borderRadius: 10, padding: '6px 14px', fontSize: 24, fontWeight: 900, letterSpacing: 3,
    background: 'rgba(0,0,0,0.5)', backdropFilter: 'blur(4px)',
  }}>{add ? t('stampLiked') : t('stampPass')}</div>;
}

// Tiny celebratory burst — a few golden particles springing outward
// when the user super-likes.  Pure CSS so no extra deps.
function SuperSparkles() {
  const N = 14;
  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 3, pointerEvents: 'none', overflow: 'hidden' }}>
      {Array.from({ length: N }).map((_, i) => {
        const angle = (i / N) * Math.PI * 2;
        const dist  = 180 + Math.random() * 80;
        const dx = Math.round(Math.cos(angle) * dist);
        const dy = Math.round(Math.sin(angle) * dist);
        const colors = ['#fbbf24','#f472b6','#06b6d4','#a855f7','#22c55e'];
        const col = colors[i % colors.length];
        // Each particle gets its own keyframes inlined with its own
        // direction baked in — avoids fighting React over CSS variables.
        const animName = `spark${i}`;
        return (
          <React.Fragment key={i}>
            <style>{`@keyframes ${animName} {
              0%   { transform: translate(0,0) scale(0.5); opacity: 1; }
              100% { transform: translate(${dx}px, ${dy}px) scale(1.2); opacity: 0; }
            }`}</style>
            <div style={{
              position: 'absolute', left: '50%', top: '50%',
              width: 12, height: 12, marginLeft: -6, marginTop: -6,
              borderRadius: '50%',
              background: col,
              boxShadow: `0 0 12px ${col}`,
              animation: `${animName} 0.6s ease-out forwards`,
            }}/>
          </React.Fragment>
        );
      })}
    </div>
  );
}

function SwipeBtn({ icon, label, color, big, onClick }) {
  return <button onClick={onClick} style={{
    padding: big ? '11px 18px' : '9px 14px', borderRadius: 999,
    background: `${color}22`, border: `1.5px solid ${color}99`, color: color,
    fontSize: big ? 13 : 12, fontWeight: 800, cursor: 'pointer',
    display: 'flex', alignItems: 'center', gap: 6,
  }}><span style={{ fontSize: big ? 16 : 14 }}>{icon}</span>{label}</button>;
}
function Pill({ children, onClick }) {
  return <div onClick={onClick} style={{ padding: '4px 8px', borderRadius: 999,
    background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)',
    cursor: 'pointer' }}>{children}</div>;
}

// ============================================================
// RADIO — stations = real categories, FM frequency is synthetic
// ============================================================
function RadioMode({ lib, addToQueue, previewSong }) {
  const t = useTr();
  const stations = React.useMemo(() => {
    const ytByCat = (lib.yt && lib.yt.itemsByCat) || {};
    const allYt = (lib.yt && lib.yt.all) || [];
    // Count per category across local + YT
    const cats = (lib.categories || []).map(c => {
      const local = lib.songs.filter(s => (s.categories || []).includes(c));
      const yt = ytByCat[c] || [];
      return { name: c, count: local.length + yt.length, local, yt };
    }).filter(r => r.count > 0);
    const ranked = cats.sort((a,b) => b.count - a.count).slice(0, 6);
    const wholeLibrary = [...lib.songs, ...allYt];

    function buildStationPool(local, yt) {
      // Interleave local + YT so the station feels mixed, not "first all local then YT".
      const mix = [];
      const maxLen = Math.max(local.length, yt.length);
      for (let k = 0; k < maxLen; k++) {
        if (k < local.length) mix.push(local[k]);
        if (k < yt.length) mix.push(yt[k]);
      }
      // Pad with random tracks from the wider library so dragging the
      // dial always reveals roughly 100 different songs even when the
      // category itself is small.  De-duped against the existing pool.
      const seen = new Set(mix.map(s => s.id));
      const filler = wholeLibrary.filter(s => !seen.has(s.id));
      // Shuffle the filler (Fisher-Yates) so we don't pick the same
      // top-of-list bonus tracks every time.
      for (let k = filler.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [filler[k], filler[j]] = [filler[j], filler[k]];
      }
      const TARGET = 100;
      while (mix.length < TARGET && filler.length) mix.push(filler.shift());
      // Final shuffle of the whole pool so category songs aren't always at
      // the start of the dial slice.  The dial position → index mapping
      // remains stable across renders because useMemo caches this list.
      for (let k = mix.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [mix[k], mix[j]] = [mix[j], mix[k]];
      }
      return mix.slice(0, 200);
    }

    if (!ranked.length) return [{
      name: 'All songs', count: lib.songs.length,
      freq: 97.1, hue: 220, songs: buildStationPool(lib.songs.slice(0, 50), []),
    }];
    const freqs = [88.1, 92.5, 97.3, 101.7, 106.9, 109.5];
    return ranked.map((r, i) => ({
      name: r.name, count: r.count,
      freq: freqs[i] || (88 + i * 3.6),
      hue: styleForCat(r.name).hue,
      songs: buildStationPool(r.local, r.yt),
    }));
  }, [lib.songs, lib.categories, lib.yt]);

  // Random starting station + song so the radio doesn't always open on the
  // same track.  Lazy-init so we don't reroll every render.
  const [stIdx, setStIdx] = React.useState(() =>
    Math.floor(Math.random() * Math.max(stations.length, 1))
  );
  const [songIdx, setSongIdx] = React.useState(() => Math.floor(Math.random() * 30));
  const [dragFreq, setDragFreq] = React.useState(null);
  const [isDragging, setIsDragging] = React.useState(false);
  const dialRef = React.useRef(null);
  const station = stations[stIdx] || stations[0];
  const stationSongs = station.songs;
  const nowTuning = stationSongs[songIdx % stationSongs.length];
  const upcoming = [1,2,3].map(d => stationSongs[(songIdx + d) % stationSongs.length]);

  const accent = `oklch(0.7 0.18 ${station.hue})`;
  const sub = '#a1a1aa'; const border = 'rgba(255,255,255,0.1)';
  const dialMin = 86, dialMax = 112;
  const posPct = f => ((f - dialMin) / (dialMax - dialMin)) * 100;
  const art = useArt(nowTuning);

  // Drag-to-tune on the dial. The needle follows the pointer; the station
  // snaps to whichever one is closest to the live frequency.
  function freqAtPointer(clientX) {
    const el = dialRef.current;
    if (!el) return station.freq;
    const rect = el.getBoundingClientRect();
    const pad = 14;
    const innerW = rect.width - pad * 2;
    const x = Math.max(0, Math.min(innerW, clientX - rect.left - pad));
    return dialMin + (x / innerW) * (dialMax - dialMin);
  }
  // Helper: pick a random song offset in the given station's pool.
  function rollSong(stationIdx) {
    const len = (stations[stationIdx] && stations[stationIdx].songs.length) || 1;
    return Math.floor(Math.random() * len);
  }
  // Map a fractional dial position (0..1) to a song index inside the
  // station's pool.  This is what makes scrubbing the dial feel like
  // a real radio: each tiny movement lands on a different track.  The
  // mapping is deterministic so going back to the same dial position
  // shows the same song — until you bounce off the station and come back.
  function songIdxFromFreq(stationIdx, f) {
    const st = stations[stationIdx];
    if (!st || !st.songs.length) return 0;
    // Find this station's range on the dial: midway to the previous and
    // next station (or the dial extremes at the edges).
    const sorted = stations.slice().sort((a, b) => a.freq - b.freq);
    const meIdx = sorted.findIndex(s => s === st);
    const lo = meIdx === 0 ? dialMin : (sorted[meIdx - 1].freq + sorted[meIdx].freq) / 2;
    const hi = meIdx === sorted.length - 1 ? dialMax : (sorted[meIdx].freq + sorted[meIdx + 1].freq) / 2;
    const frac = Math.max(0, Math.min(0.9999, (f - lo) / Math.max(0.001, hi - lo)));
    return Math.floor(frac * st.songs.length);
  }
  function updateFromFreq(f) {
    setDragFreq(f);
    let best = 0, bestDist = Infinity;
    stations.forEach((s, i) => {
      const d = Math.abs(s.freq - f);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    // Station change → switch.  Otherwise scrub the song based on dial
    // sub-position so every fine movement lands on a different track.
    if (best !== stIdx) {
      setStIdx(best);
      setSongIdx(songIdxFromFreq(best, f));
    } else {
      setSongIdx(songIdxFromFreq(best, f));
    }
  }
  function onDialDown(e) {
    e.currentTarget.setPointerCapture(e.pointerId);
    setIsDragging(true);
    updateFromFreq(freqAtPointer(e.clientX));
  }
  function onDialMove(e) {
    if (e.buttons === 0) return;
    updateFromFreq(freqAtPointer(e.clientX));
  }
  function onDialUp() {
    // Leave the needle where the user dropped it — don't snap back to the
    // station's centre frequency.  The user fought to land there; respect it.
    setIsDragging(false);
  }
  // Mouse-wheel tuning — desktop testers don't have a touchscreen and the
  // drag UX is awkward with a mouse.  Wheel up/down nudges the dial freq
  // in 0.3 steps so each notch lands on a different song.  Tracked via
  // dragFreq so the needle snaps back when the user pauses.
  const dialFreqRef = React.useRef(station.freq);
  React.useEffect(() => { dialFreqRef.current = dragFreq != null ? dragFreq : station.freq; },
                  [dragFreq, station.freq]);
  function onDialWheel(e) {
    e.preventDefault();
    const step = e.deltaY > 0 ? -0.3 : 0.3;  // wheel up → tune up
    let next = (dialFreqRef.current || station.freq) + step;
    next = Math.max(dialMin, Math.min(dialMax, next));
    dialFreqRef.current = next;
    updateFromFreq(next);
  }
  const needleFreq = dragFreq !== null ? dragFreq : station.freq;

  if (!nowTuning) {
    return <div style={{ padding: 40, color: sub }}>{t('noStations')}</div>;
  }

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column',
      padding: 18, gap: 12, minHeight: 0,
      background: `radial-gradient(ellipse at 50% 30%, oklch(0.2 0.15 ${station.hue} / 0.5), transparent 60%)`,
      transition: 'background 0.4s',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <div style={{ fontSize: 12, color: sub, letterSpacing: 2, textTransform: 'uppercase',
          fontWeight: 700 }}>📡 {t('radioTune')}</div>
        <div style={{ flex: 1 }} />
        <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 13, fontWeight: 800,
          color: accent, padding: '4px 10px', borderRadius: 6, background: 'rgba(0,0,0,0.6)',
          border: `1px solid ${accent}`, letterSpacing: 1 }}>
          {station.freq.toFixed(1)} FM
        </div>
      </div>

      <div style={{ position: 'relative', borderRadius: 16, overflow: 'hidden',
        border: `1px solid ${border}`, flexShrink: 0,
        background: `linear-gradient(135deg, oklch(0.28 0.18 ${station.hue}), oklch(0.1 0.1 ${station.hue}))`,
        transition: 'background 0.4s',
      }}>
        <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none',
          background: 'repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,0.14) 3px 4px)' }}/>
        <div style={{ position: 'relative', padding: 18, display: 'flex', gap: 18,
          alignItems: 'center' }}>
          <div style={{ position: 'relative', width: 160, height: 160, flexShrink: 0 }}>
            {art ? (
              <img src={art} alt="" style={{
                width: '100%', height: '100%', borderRadius: 10, objectFit: 'cover',
                boxShadow: `0 0 40px oklch(0.6 0.18 ${station.hue} / 0.7), 0 12px 30px rgba(0,0,0,0.6)`,
              }}/>
            ) : (
              <RealArtTile song={nowTuning} size={160}
                style={{ width: '100%', height: '100%' }}/>
            )}
            <div style={{ position: 'absolute', inset: -10, borderRadius: 14,
              border: `2px solid ${accent}`, opacity: 0.4,
              animation: 'pulse 2s ease-in-out infinite' }}/>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 10, letterSpacing: 3, color: accent, fontWeight: 800,
              textTransform: 'uppercase' }}>📡 {t('nowTuningLbl')} · {station.name}</div>
            <div style={{ fontFamily: 'Georgia, serif', fontStyle: 'italic',
              fontSize: 30, fontWeight: 900, lineHeight: 1.05, marginTop: 6,
              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {nowTuning.title}
            </div>
            <div style={{ fontSize: 15, color: '#d4d4d8', marginTop: 4 }}>
              {nowTuning.artist}{nowTuning.duration && nowTuning.duration !== '--:--' ? ' · ' + nowTuning.duration : ''}
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
              <button onClick={() => addToQueue(nowTuning)} style={{
                padding: '9px 18px', borderRadius: 999, border: 'none',
                background: accent, color: '#111', fontWeight: 800, fontSize: 13, cursor: 'pointer',
              }}>+ {t('queueThis')}</button>
              <button onClick={() => previewSong && previewSong(nowTuning)} style={{
                padding: '9px 14px', borderRadius: 999, background: 'rgba(255,255,255,0.12)',
                border: `1px solid ${accent}`, color: accent, fontWeight: 700, fontSize: 13,
                cursor: 'pointer' }}>▶ {t('playNow')}</button>
              <button onClick={() => setSongIdx(i => i + 1)} style={{
                padding: '9px 14px', borderRadius: 999, background: 'rgba(255,255,255,0.08)',
                border: `1px solid ${border}`, color: 'white', fontWeight: 700, fontSize: 13,
                cursor: 'pointer' }}>⏭ {t('nextSong')}</button>
              <button onClick={() => setSongIdx(i => i + 10)} style={{
                padding: '9px 14px', borderRadius: 999, background: 'rgba(255,255,255,0.06)',
                border: `1px solid ${border}`, color: '#9ca3af', fontWeight: 700, fontSize: 12,
                cursor: 'pointer' }}>⏭⏭ {t('skip10')}</button>
            </div>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 2, padding: '0 18px 14px' }}>
          {[...Array(32)].map((_, i) => (
            <div key={i} style={{
              flex: 1, height: 10, borderRadius: 1,
              background: i < 22 ? accent : 'rgba(255,255,255,0.08)',
              opacity: i < 22 ? (1 - i*0.025) : 1,
              animation: i < 22 ? `pulse ${0.8 + (i%4)*0.15}s ease-in-out infinite` : 'none',
            }}/>
          ))}
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
        {upcoming.map((s, i) => s && (
          <div key={i} onClick={() => addToQueue(s)} style={{
            display: 'flex', gap: 8, padding: 8, borderRadius: 10,
            background: 'rgba(255,255,255,0.04)', border: `1px solid ${border}`,
            cursor: 'pointer', alignItems: 'center',
          }}>
            <RealArtTile song={s} size={48}/>
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ fontSize: 9, color: sub, letterSpacing: 1 }}>{t('upNext')} · #{i+1}</div>
              <div style={{ fontSize: 12, fontWeight: 700, overflow: 'hidden',
                textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.title}</div>
              <div style={{ fontSize: 10, color: sub, overflow: 'hidden',
                textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.artist}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ flex: 1 }}/>

      {/* Dial — drag anywhere on the track to tune */}
      <div ref={dialRef}
        onPointerDown={onDialDown}
        onPointerMove={onDialMove}
        onPointerUp={onDialUp}
        onPointerCancel={onDialUp}
        onWheel={onDialWheel}
        title="Drag, scroll, or use ← → arrows to tune"
        style={{ position: 'relative', height: 80, padding: '0 14px', flexShrink: 0,
          cursor: isDragging ? 'grabbing' : 'grab', touchAction: 'none',
          userSelect: 'none',
        }}>
        {/* Hit area — full-height invisible overlay so the whole strip is draggable */}
        <div style={{ position: 'absolute', left: 14, right: 14, top: 0, bottom: 0 }}/>
        <div style={{ position: 'absolute', left: 14, right: 14, top: 34, height: 14, borderRadius: 4,
          background: 'linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.14), rgba(255,255,255,0.04))',
          border: `1px solid ${border}`, pointerEvents: 'none',
        }}/>
        {[...Array(27)].map((_, i) => (
          <div key={i} style={{
            position: 'absolute', left: `calc(${(i/26)*100}% + 14px - 1px)`, top: 30,
            width: 1, height: i % 5 === 0 ? 22 : 12,
            background: i % 5 === 0 ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.2)',
            pointerEvents: 'none',
          }}/>
        ))}
        {stations.map((s, i) => (
          <div key={s.name} onPointerDown={e => {
              e.stopPropagation();
              setStIdx(i); setSongIdx(rollSong(i));
              setDragFreq(s.freq);  // park needle at this station's centre
            }} style={{
            position: 'absolute', left: `${posPct(s.freq)}%`, top: 0,
            transform: 'translateX(-50%)', textAlign: 'center', cursor: 'pointer', minWidth: 60,
          }}>
            <div style={{ fontSize: 10,
              color: i === stIdx ? `oklch(0.7 0.18 ${s.hue})` : sub,
              fontWeight: 800, letterSpacing: 1, whiteSpace: 'nowrap' }}>{s.name}</div>
            <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 9, color: sub }}>
              {s.freq.toFixed(1)}
            </div>
          </div>
        ))}
        <div style={{
          position: 'absolute', left: `calc(${posPct(needleFreq)}% + 14px)`, top: 26,
          transform: 'translateX(-50%)', width: 4, height: 30,
          background: accent, borderRadius: 2,
          boxShadow: `0 0 14px ${accent}, 0 0 28px ${accent}80`,
          transition: isDragging ? 'none' : 'left 0.4s cubic-bezier(.2,.9,.2,1)',
          pointerEvents: 'none',
        }}/>
      </div>
    </div>
  );
}

// ============================================================
// QUEUE RAIL — Now Playing + Up Next
// ============================================================
function QueueRail({ queue, nowPlaying, paused, remove, move, accent, onPause, onSkip, onPlay,
                     onRestart, onSeekForward, hasMultiplex, vocalsOn, onToggleVocals,
                     volume, onVolume, screenMode }) {
  const t = useTr();
  // Drag-to-reorder state — works for mouse + Windows touch (HTML5 drag).
  // For pure touchscreen tablets where HTML5 dnd is unreliable, the ▲▼
  // buttons next to ✕ provide an explicit fallback.
  const [dragIdx, setDragIdx]   = React.useState(null);
  const [overIdx, setOverIdx]   = React.useState(null);
  // Player fullscreen overlay — double-tap or double-click to toggle.
  // Stays mounted in the same DOM so playback never interrupts; we just
  // promote the wrapper to position:fixed covering the whole screen.
  const [playerExpanded, setPlayerExpanded] = React.useState(false);
  const _lastTapRef = React.useRef(0);
  const _tapTimerRef = React.useRef(null);
  function handlePlayerTap(e) {
    e.preventDefault();
    e.stopPropagation();
    const now = Date.now();
    const elapsed = now - _lastTapRef.current;
    if (elapsed > 0 && elapsed < 400) {
      // Second tap within 400ms — toggle and reset.
      clearTimeout(_tapTimerRef.current);
      _tapTimerRef.current = null;
      _lastTapRef.current = 0;
      setPlayerExpanded(v => !v);
    } else {
      // First tap — record time and arm a reset so a stale tap doesn't
      // accidentally pair with one 5 minutes later.
      _lastTapRef.current = now;
      clearTimeout(_tapTimerRef.current);
      _tapTimerRef.current = setTimeout(() => { _lastTapRef.current = 0; }, 500);
    }
  }
  // Esc to exit fullscreen
  React.useEffect(() => {
    if (!playerExpanded) return;
    function onKey(e) { if (e.key === 'Escape') setPlayerExpanded(false); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [playerExpanded]);
  function onDragStart(i, e) {
    setDragIdx(i);
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(i)); } catch (_) {}
    }
  }
  function onDragOver(i, e) {
    e.preventDefault();
    if (dragIdx == null) return;
    if (overIdx !== i) setOverIdx(i);
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  }
  function onDrop(i, e) {
    e.preventDefault();
    if (dragIdx != null && move) move(dragIdx, i);
    setDragIdx(null); setOverIdx(null);
  }
  function onDragEnd() { setDragIdx(null); setOverIdx(null); }
  const sub = '#a1a1aa'; const border = 'rgba(255,255,255,0.08)';
  const dotColor = nowPlaying && !paused ? '#22c55e'
                : nowPlaying ? '#fbbf24' : '#6b7280';
  const labelText = nowPlaying && !paused ? t('lblPlaying')
                  : nowPlaying ? t('lblPaused') : t('lblIdle');
  return (
    <div style={{ borderLeft: `1px solid ${border}`, padding: 18,
      display: 'flex', flexDirection: 'column', gap: 14, minHeight: 0,
      background: 'rgba(0,0,0,0.4)' }}>
      <div>
        <div style={{ fontSize: 10, fontWeight: 800, color: dotColor, letterSpacing: 3,
          textTransform: 'uppercase', marginBottom: 8,
          display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 4,
            background: dotColor, boxShadow: `0 0 10px ${dotColor}`,
            animation: nowPlaying && !paused ? 'pulse 1.2s infinite' : 'none' }}/>
          {labelText}
        </div>
        <div
          style={
            playerExpanded
              ? {
                  // Fullscreen overlay — covers the whole viewport.
                  position: 'fixed', inset: 0, zIndex: 9999,
                  background: '#000',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }
              : {
                  aspectRatio: '16/9', borderRadius: 10, overflow: 'hidden',
                  border: `1px solid ${border}`, position: 'relative',
                  background: '#000',
                }
          }>
          {/* Inner wrapper holds the actual media. When expanded, this
              becomes a 16:9 box centred in the black overlay. */}
          <div style={{
            position: 'relative', width: '100%', height: '100%',
            ...(playerExpanded ? { maxWidth: '100vw', maxHeight: '100vh', aspectRatio: '16/9' } : {}),
          }}>
          <RealNowPlayingArt song={nowPlaying}/>
          {/* Live media surface — sits on top of the artwork.  Hidden by
              the player when no song is playing or when it's an audio-only
              track.  Stays in the same DOM position across renders so the
              media elements aren't unmounted. */}
          {/* zIndex:2 so media renders ABOVE the artwork — without it, the
              foreground <img> in RealNowPlayingArt (which has zIndex:1) wins
              the stacking contest, leaving the video hidden underneath. */}
          {/* In dual-screen mode, all video/canvas/iframe stay in the DOM
              (so player.js can drive them for audio + sync timing) but are
              visually hidden — the second screen is showing the real video,
              the booth just shows the album art and song info. */}
          <video id="bvVid" preload="auto" playsinline muted={false}
            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%',
              objectFit: 'contain', background: '#000',
              display: 'none', zIndex: 2,
              visibility: screenMode === 'dual' ? 'hidden' : 'visible' }}/>
          <canvas id="bvCdg" width="300" height="216"
            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%',
              objectFit: 'contain', background: '#000',
              imageRendering: 'pixelated', display: 'none', zIndex: 2,
              visibility: screenMode === 'dual' ? 'hidden' : 'visible' }}/>
          <iframe id="bvYt" allow="autoplay; encrypted-media" allowFullScreen
            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%',
              border: 'none', background: '#000', display: 'none', zIndex: 2,
              visibility: screenMode === 'dual' ? 'hidden' : 'visible' }}/>
          {/* "Playing on TV" badge — dual mode only, when a song is playing */}
          {screenMode === 'dual' && nowPlaying && (
            <div style={{
              position: 'absolute', top: 12, left: 12, zIndex: 5,
              background: 'rgba(0,0,0,0.65)', color: '#fbbf24',
              padding: '5px 12px', borderRadius: 999,
              fontSize: 10, fontWeight: 800, letterSpacing: 2,
              border: '1px solid rgba(251,191,36,0.4)',
              pointerEvents: 'none', textTransform: 'uppercase',
            }}>📺 PLAYING ON TV</div>
          )}
          {/* Transparent click-catcher on top of EVERYTHING — exclusively
              owns tap detection so taps never reach the underlying <video>
              / <img> elements (which have their own click semantics that
              were causing inconsistent double-tap behaviour). */}
          <div
            onClick={handlePlayerTap}
            style={{
              position: 'absolute', inset: 0, zIndex: 10,
              cursor: nowPlaying ? 'pointer' : 'default',
              background: 'transparent',
              // touchAction:manipulation removes the 300ms tap delay on mobile
              touchAction: 'manipulation',
              WebkitTapHighlightColor: 'transparent',
            }}
          />
          {/* Hint pill — visible only in expanded mode so users know how to exit */}
          {playerExpanded && (
            <div style={{
              position: 'absolute', top: 16, right: 16, zIndex: 11,
              background: 'rgba(0,0,0,0.6)', color: 'white',
              padding: '6px 12px', borderRadius: 999,
              fontSize: 11, fontWeight: 700, letterSpacing: 1,
              pointerEvents: 'none',
            }}>DOUBLE-TAP TO EXIT</div>
          )}
          </div>
        </div>
        {nowPlaying && (
          <div style={{ marginTop: 8, fontSize: 12, lineHeight: 1.3 }}>
            <div style={{ fontWeight: 800, overflow: 'hidden',
              textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nowPlaying.title}</div>
            <div style={{ color: sub, overflow: 'hidden',
              textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nowPlaying.artist}</div>
          </div>
        )}
        {/* Transport controls */}
        <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
          {!nowPlaying ? (
            <button onClick={onPlay} disabled={!queue.length} style={{
              flex: 2, padding: '10px 0', borderRadius: 8,
              background: queue.length ? '#22c55e' : 'rgba(255,255,255,0.04)',
              border: queue.length ? '1px solid #22c55e' : `1px solid ${border}`,
              color: queue.length ? '#0b1f10' : '#6b7280',
              fontWeight: 900, fontSize: 14, letterSpacing: 1,
              cursor: queue.length ? 'pointer' : 'default',
              boxShadow: queue.length ? '0 0 18px rgba(34,197,94,0.35)' : 'none',
            }}>▶ {queue.length ? t('playQueue') : t('queueEmptyBtn')}</button>
          ) : (
            <>
              <button onClick={onPause} style={{
                flex: 1, padding: '8px 0', borderRadius: 8,
                background: 'rgba(255,255,255,0.08)',
                border: `1px solid ${border}`, color: 'white',
                fontWeight: 800, fontSize: 13, cursor: 'pointer',
                touchAction: 'manipulation',
                WebkitTapHighlightColor: 'transparent',
              }}>{paused ? '▶ ' + t('btnResume') : '⏸ ' + t('btnPause')}</button>
              <button onClick={onSeekForward} title="Skip forward 5 seconds" style={{
                padding: '8px 12px', borderRadius: 8,
                background: 'rgba(255,255,255,0.08)',
                border: `1px solid ${border}`, color: 'white',
                fontWeight: 800, fontSize: 13, cursor: 'pointer',
                touchAction: 'manipulation',
                WebkitTapHighlightColor: 'transparent',
              }}>⏩ +5s</button>
              <button onClick={onSkip} style={{
                flex: 1, padding: '8px 0', borderRadius: 8,
                background: 'rgba(255,255,255,0.08)',
                border: `1px solid ${border}`, color: 'white',
                fontWeight: 800, fontSize: 13, cursor: 'pointer',
                touchAction: 'manipulation',
                WebkitTapHighlightColor: 'transparent',
              }}>⏭ {t('btnSkip')}</button>
            </>
          )}
        </div>
        {/* Multiplex vocals toggle — shown only on multiplex karaoke files
            where the right channel has the demo vocal track. */}
        {hasMultiplex && (
          <button onClick={onToggleVocals} style={{
            marginTop: 6, width: '100%', padding: '8px 0', borderRadius: 8,
            background: vocalsOn ? 'rgba(168,85,247,0.25)' : 'rgba(255,255,255,0.04)',
            border: `1px solid ${vocalsOn ? '#a855f7' : border}`,
            color: vocalsOn ? '#d8b4fe' : '#94a3b8',
            fontWeight: 800, fontSize: 12, cursor: 'pointer',
            letterSpacing: 1,
          }}>
            🎤 Vocals: {vocalsOn ? 'ON (demo)' : 'OFF (karaoke)'}
          </button>
        )}
        {/* Restart current song */}
        {nowPlaying && onRestart && (
          <button onClick={onRestart} style={{
            marginTop: 6, width: '100%', padding: '6px 0', borderRadius: 8,
            background: 'rgba(34,197,94,0.15)',
            border: `1px solid rgba(34,197,94,0.4)`,
            color: '#86efac', fontWeight: 700, fontSize: 11, cursor: 'pointer',
          }}>🔄 {t('btnRestart')}</button>
        )}
        {/* Volume slider */}
        {onVolume && (
          <div style={{ marginTop: 8, padding: 8, borderRadius: 8,
            background: 'rgba(255,255,255,0.03)', border: `1px solid ${border}` }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              fontSize: 10, fontWeight: 800, letterSpacing: 2,
              textTransform: 'uppercase', color: sub, marginBottom: 6 }}>
              <span>🔊 {t('lblVolume')}</span>
              <span style={{ fontFamily: 'ui-monospace, monospace', color: 'white' }}>{volume}%</span>
            </div>
            <input type="range" min="0" max="100" value={volume}
              onChange={e => onVolume(parseInt(e.target.value, 10))}
              style={{ width: '100%', accentColor: accent || '#fbbf24' }}/>
          </div>
        )}
      </div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        <div style={{ fontSize: 10, fontWeight: 800, color: sub, letterSpacing: 3,
          textTransform: 'uppercase', marginBottom: 8,
          display: 'flex', justifyContent: 'space-between' }}>
          <span>{t('upNext')} · {queue.length}</span>
          <span style={{ color: accent, cursor: 'pointer' }}>{t('shuffle')}</span>
        </div>
        <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 6 }}>
          {queue.map((q, i) => {
            const isBeingDragged = dragIdx === i;
            const isDropTarget   = overIdx === i && dragIdx !== null && dragIdx !== i;
            return (
              <div key={q.qid}
                draggable="true"
                onDragStart={e => onDragStart(i, e)}
                onDragOver={e => onDragOver(i, e)}
                onDrop={e => onDrop(i, e)}
                onDragEnd={onDragEnd}
                style={{
                  display: 'flex', alignItems: 'center', gap: 8, padding: 6,
                  borderRadius: 8,
                  background: isDropTarget ? 'rgba(251,191,36,0.18)' : 'rgba(255,255,255,0.03)',
                  border: `1px solid ${isDropTarget ? '#fbbf24' : border}`,
                  opacity: isBeingDragged ? 0.4 : 1,
                  transition: 'background 0.15s, border-color 0.15s',
                  animation: !dragIdx && i === queue.length-1 ? 'slideIn 0.3s' : 'none',
                  cursor: 'grab',
                }}>
                {/* Drag handle (visible cue that the row is grabbable) */}
                <div title="Drag to reorder" style={{ color: sub, fontSize: 14,
                  cursor: 'grab', userSelect: 'none', lineHeight: 1, padding: '0 2px' }}>≡</div>
                <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 11,
                  color: sub, width: 14, textAlign: 'center' }}>{i+1}</div>
                <RealArtTile song={q} size={36}/>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, overflow: 'hidden',
                    textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                    display: 'flex', alignItems: 'center', gap: 6 }}>
                    {q.isYt && <span title="Streaming" style={{ fontSize: 11, color: '#67e8f9',
                      flexShrink: 0 }}>📡</span>}
                    <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{q.title}</span>
                  </div>
                  <div style={{ fontSize: 10, color: sub, overflow: 'hidden',
                    textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{q.artist}</div>
                </div>
                {/* Up/down buttons for touch — HTML5 dnd doesn't fire on
                    most touchscreen kiosks, so these are the real reorder UI. */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                  <button onClick={() => move && move(i, i - 1)} disabled={i === 0}
                    style={{ background: i === 0 ? 'transparent' : 'rgba(255,255,255,0.08)',
                      border: `1px solid ${i === 0 ? 'transparent' : 'rgba(255,255,255,0.15)'}`,
                      color: i === 0 ? '#444' : '#e5e7eb', padding: '4px 8px',
                      borderRadius: 6, fontSize: 13, lineHeight: 1, fontWeight: 700,
                      cursor: i === 0 ? 'default' : 'pointer',
                      touchAction: 'manipulation',
                      WebkitTapHighlightColor: 'transparent',
                    }}>▲</button>
                  <button onClick={() => move && move(i, i + 1)} disabled={i === queue.length - 1}
                    style={{ background: i === queue.length - 1 ? 'transparent' : 'rgba(255,255,255,0.08)',
                      border: `1px solid ${i === queue.length - 1 ? 'transparent' : 'rgba(255,255,255,0.15)'}`,
                      color: i === queue.length - 1 ? '#444' : '#e5e7eb', padding: '4px 8px',
                      borderRadius: 6, fontSize: 13, lineHeight: 1, fontWeight: 700,
                      cursor: i === queue.length - 1 ? 'default' : 'pointer',
                      touchAction: 'manipulation',
                      WebkitTapHighlightColor: 'transparent',
                    }}>▼</button>
                </div>
                <div onClick={() => remove(q.qid)} style={{ color: sub, fontSize: 16,
                  cursor: 'pointer', padding: 6, userSelect: 'none',
                  touchAction: 'manipulation',
                }}>✕</div>
              </div>
            );
          })}
          {!queue.length && (
            <div style={{ padding: 20, textAlign: 'center', color: sub, fontSize: 12 }}>
              Queue's empty — go pick something!
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
